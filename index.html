<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0B1220" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#EEF2F9" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Catat Panda">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Catat Panda</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#021024; --s1:rgba(193,232,255,.06); --s2:rgba(193,232,255,.10); --line:rgba(193,232,255,.13);
  --tx:#E9F4FF; --mut:#8FB3D9;
  --mint:#C1E8FF; --mint-ink:#03172E; --coral:#FFB0A3; --amber:#F3D2A6;
  --shadow:0 18px 40px rgba(1,8,20,.55);
  --glass:blur(11px) saturate(118%);
  font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#EAF3FC; --s1:rgba(255,255,255,.74); --s2:rgba(255,255,255,.58); --line:rgba(5,38,89,.12);
         --tx:#04182F; --mut:#4F6C8F; --mint:#0B4F8A; --mint-ink:#FFFFFF; --coral:#B4442F; --amber:#8A5A0B;
         --shadow:0 18px 40px rgba(5,38,89,.16); }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg)}
body{color:var(--tx);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;-webkit-text-size-adjust:100%;min-height:100vh;
  background:
    radial-gradient(64% 46% at 6% -12%, rgba(84,131,179,.38), transparent 62%),
    radial-gradient(52% 38% at 104% -4%, rgba(125,160,202,.26), transparent 60%),
    radial-gradient(78% 50% at 50% 110%, rgba(5,38,89,.85), transparent 64%),
    var(--bg);
  background-attachment:fixed}
@media (prefers-color-scheme: light){
  body{background:
    radial-gradient(64% 46% at 6% -12%, rgba(84,131,179,.34), transparent 62%),
    radial-gradient(52% 38% at 104% -4%, rgba(193,232,255,.60), transparent 60%),
    radial-gradient(78% 50% at 50% 110%, rgba(125,160,202,.22), transparent 64%),
    var(--bg);background-attachment:fixed}
}
.mono{font-family:'DM Mono',ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.hdr{position:sticky;top:0;z-index:15;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 12px 10px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 78%,transparent),color-mix(in srgb,var(--bg) 55%,transparent));
  backdrop-filter:blur(13px) saturate(120%);-webkit-backdrop-filter:blur(13px) saturate(120%)}
.monthbar{display:flex;align-items:center;gap:4px;flex:1;min-width:0}
.monthbar button{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--s1);font-size:22px;line-height:1;cursor:pointer;flex:none;touch-action:manipulation;display:flex;align-items:center;justify-content:center}
.monthbar button:active{background:var(--s2);transform:scale(.96)}
.monthbar button:disabled{opacity:.3}
.monthbar .lbl{font-weight:700;font-size:18px;letter-spacing:-.01em;flex:1;text-align:center;white-space:nowrap;line-height:1.15;min-width:0}
.monthbar .lbl small{display:block;font-weight:500;font-size:12px;letter-spacing:0;color:var(--mut)}
.chip{background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:7px 11px;font-size:13px;font-weight:500;white-space:nowrap;flex:none}
.spin{display:inline-block;animation:rot .9s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.ptr{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 74px);text-align:center;font-size:12px;color:var(--mut);opacity:0;pointer-events:none;z-index:14}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.05;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>")}
.view{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:6px 16px calc(120px + env(safe-area-inset-bottom,0px));animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.view > *{animation:rise .34s cubic-bezier(.2,.8,.2,1) both}
.view > *:nth-child(2){animation-delay:.03s}.view > *:nth-child(3){animation-delay:.06s}
.view > *:nth-child(4){animation-delay:.09s}.view > *:nth-child(5){animation-delay:.12s}
.view > *:nth-child(6){animation-delay:.15s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view > *{animation:none}}
.card{background:linear-gradient(160deg,rgba(193,232,255,.10),rgba(193,232,255,.045));border:1px solid var(--line);border-radius:26px;padding:18px;margin-bottom:14px;
  backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);box-shadow:0 12px 32px rgba(1,8,20,.35),inset 0 1px 0 rgba(193,232,255,.09)}
.card h2{margin:0 0 14px;font-size:13.5px;font-weight:700;letter-spacing:-.01em;text-transform:none;color:var(--tx);display:flex;justify-content:space-between;align-items:center;position:relative;padding-left:11px}
.card h2::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:14px;border-radius:2px;background:linear-gradient(180deg,var(--mint),#5483B3)}
.card h2 a{font-size:12px;letter-spacing:0;text-transform:none;color:var(--mint);font-weight:500;background:none;border:none;cursor:pointer;padding:0}
.hero .k{font-size:12px;letter-spacing:.09em;color:var(--mut);font-weight:700;text-transform:uppercase}
.hero .big{font-size:38px;font-weight:500;margin:6px 0 2px;letter-spacing:-.025em}
.hero2{position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.14);
  background:linear-gradient(150deg,#052659 0%,#0A3E7A 48%,#5483B3 100%);
  box-shadow:0 18px 40px rgba(2,16,36,.55),inset 0 1px 0 rgba(193,232,255,.22)}
.hero2::before{content:'';position:absolute;inset:-30% -20%;pointer-events:none;
  background:radial-gradient(55% 55% at 82% 8%,rgba(193,232,255,.30),transparent 62%),radial-gradient(45% 45% at 6% 92%,rgba(84,131,179,.55),transparent 62%)}
.hero2 .k,.hero2 .sub{color:rgba(255,255,255,.65)}
.hero2 .big{color:#fff;font-size:42px}
.hero2 .stat{background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.12);backdrop-filter:blur(6px)}
.hero2 .stat .k{color:rgba(255,255,255,.6)}
.hero2 .pos{color:#C1E8FF}.hero2 .neg{color:#FFC8BC}
.herochip{display:inline-flex;align-items:center;gap:5px;margin-top:12px;padding:5px 11px;border-radius:999px;
  background:rgba(255,255,255,.14);font-size:11.5px;font-weight:600;color:#fff}
.hero .sub{font-size:13px;color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.stat{background:var(--s2);border:1px solid var(--line);border-radius:16px;padding:11px 12px;min-width:0;backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
.stat .k{font-size:11px;color:var(--mut);font-weight:500}
.stat .v{font-size:16px;font-weight:500;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pos{color:var(--mint)} .neg{color:var(--coral)} .warn{color:var(--amber)}
.banner{background:color-mix(in srgb,var(--amber) 14%,var(--s1));border:1px solid color-mix(in srgb,var(--amber) 45%,var(--line));border-radius:16px;padding:12px 14px;margin-bottom:14px;font-size:13.5px;line-height:1.45}
.banner b{color:var(--amber)} .banner details{margin-top:6px;color:var(--mut)} .banner li{margin:4px 0}
.banner button{margin-top:8px;border:1px solid var(--line);background:var(--s1);border-radius:10px;padding:6px 12px;font-size:13px;cursor:pointer}
.banner.info{background:color-mix(in srgb,var(--mint) 12%,var(--s1));border-color:color-mix(in srgb,var(--mint) 40%,var(--line))}
.banner.info b{color:var(--mint)}
.donutwrap{display:flex;align-items:center;gap:14px}
.donutwrap svg{width:128px;height:128px;flex:none}
.legend{flex:1;min-width:0}
.lg{display:flex;align-items:center;gap:8px;font-size:13px;padding:5px 0}
.lg .dot{width:9px;height:9px;border-radius:50%;flex:none}
.lg .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg .p{color:var(--mut);font-size:12px;min-width:38px;text-align:right}
.catrow{margin-top:14px;border-top:1px solid var(--line);padding-top:6px}
.cr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;font-size:14px}
.cr .a{font-size:13.5px}
.bar{height:5px;border-radius:5px;background:var(--s2);margin-top:2px;overflow:hidden}
.bar span{display:block;height:100%;border-radius:5px}
.legend2{display:flex;gap:14px;margin-top:6px;font-size:12px;color:var(--mut)}
.legend2 i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.tx{display:flex;align-items:center;gap:12px;padding:10px 0;border:none;border-top:1px solid var(--line);background:none;width:100%;text-align:left;cursor:pointer}
.tx:first-child{border-top:none}
.ico{width:42px;height:42px;border-radius:14px;background:var(--s2);display:grid;place-items:center;font-size:19px;flex:none;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.tx .m{flex:1;min-width:0}
.tx .d{font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .s{font-size:12px;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .a{font-size:14.5px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tag{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:6px;background:var(--s2);margin-left:6px;color:var(--mut);vertical-align:1px}
.tag.cek{background:color-mix(in srgb,var(--amber) 22%,transparent);color:var(--amber)}
.empty{color:var(--mut);font-size:14px;padding:6px 0}
.kv{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-top:1px solid var(--line);font-size:14px;gap:10px}
.kv:first-of-type{border-top:none}
.kv small{display:block;color:var(--mut);font-size:11.5px;margin-top:2px}
.day{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);font-weight:700;letter-spacing:.04em;padding:14px 2px 4px;text-transform:uppercase}
.day span.mono{text-transform:none;font-weight:500}
.search{width:100%;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-size:16px;color:var(--tx);font-family:inherit;margin-bottom:10px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.search::placeholder{color:var(--mut)}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;border:1px solid var(--line);background:var(--s1);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:500;cursor:pointer}
.filters button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.tabbar{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:20;display:grid;grid-template-columns:1fr 1fr 74px 1fr 1fr;align-items:end;
  padding:6px 8px;border:1px solid var(--line);border-radius:26px;
  background:linear-gradient(180deg,rgba(193,232,255,.12),rgba(193,232,255,.05));
  backdrop-filter:blur(15px) saturate(125%);-webkit-backdrop-filter:blur(15px) saturate(125%);
  box-shadow:0 14px 34px rgba(1,8,20,.5),inset 0 1px 0 rgba(193,232,255,.14)}
.tab{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--mut);padding:4px 0;cursor:pointer}
.tab svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--mint);background:color-mix(in srgb,var(--mint) 14%,transparent);border-radius:16px}
.add{justify-self:center;width:56px;height:56px;border-radius:20px;border:none;background:linear-gradient(135deg,var(--mint),color-mix(in srgb,var(--mint) 42%,#052659));color:var(--mint-ink);font-size:30px;font-weight:500;margin-top:-26px;box-shadow:0 12px 28px rgba(84,131,179,.45);cursor:pointer;transition:transform .15s}
.add:active{transform:scale(.93)}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;animation:fadebg .2s}
@keyframes fadebg{from{opacity:0}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:540px;margin:0 auto;border-radius:28px 28px 0 0;border:1px solid var(--line);border-bottom:none;
  background:linear-gradient(180deg,rgba(5,38,89,.94),rgba(2,16,36,.97));
  backdrop-filter:blur(18px) saturate(130%);-webkit-backdrop-filter:blur(18px) saturate(130%);
  padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto;box-shadow:0 -10px 40px rgba(0,0,0,.5);animation:up .28s cubic-bezier(.2,.8,.2,1)}
@media (prefers-color-scheme: light){
  .sheet{background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(244,248,255,.98))}
}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.grab{width:38px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:0 0 12px;font-size:18px;display:flex;justify-content:space-between;align-items:center}
.iconbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--s2);font-size:15px;cursor:pointer}
.seg{display:flex;background:var(--s2);border-radius:14px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;border:none;background:transparent;padding:10px 6px;border-radius:11px;font-weight:700;font-size:14px;cursor:pointer;color:var(--mut)}
.seg button.on{background:var(--tx);color:var(--bg)}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;color:var(--mut);margin-bottom:5px;font-weight:500}
.fld input,.fld select{width:100%;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:12px 13px;font-size:16px;color:var(--tx);font-family:inherit;appearance:none;-webkit-appearance:none;min-height:48px}
.amtbox{display:flex;align-items:center;gap:8px;background:var(--s2);border:1px solid var(--line);border-radius:16px;padding:6px 14px}
.amtbox span{color:var(--mut);font-size:18px}
.amtbox input{border:none;background:transparent;font-size:30px;padding:8px 0;outline:none!important;width:100%;color:var(--tx);min-height:0}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.quick button{border:1px solid var(--line);background:var(--s2);border-radius:999px;padding:8px 13px;font-size:13px;cursor:pointer}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2.m{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr)}
.row2.m input[type=date]{min-width:0}
.row2.m select,.row2.m input{font-size:15px;padding-left:12px;padding-right:8px}
.hint{font-size:12px;color:var(--mut);margin:-4px 0 12px}
.chk{display:flex;align-items:center;gap:10px;font-size:13.5px;margin:2px 0 8px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--mint);flex:none}
.btn{width:100%;border:none;background:linear-gradient(135deg,var(--mint),color-mix(in srgb,var(--mint) 42%,#052659));color:var(--mint-ink);font-weight:700;font-size:16px;padding:15px;border-radius:16px;cursor:pointer;margin-top:4px;
  box-shadow:0 10px 26px rgba(84,131,179,.35),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:disabled{opacity:.55}
.btn.ghost{background:var(--s2);color:var(--tx);border:1px solid var(--line);font-weight:500;box-shadow:none;backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
.btn.danger{background:color-mix(in srgb,var(--coral) 18%,var(--s2));color:var(--coral);border:1px solid color-mix(in srgb,var(--coral) 45%,var(--line))}
.err{color:var(--coral);font-size:13px;min-height:18px;margin:6px 2px 0}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.skel{height:14px;border-radius:7px;background:var(--s2);margin:10px 0;animation:p 1.2s ease-in-out infinite}
@keyframes p{50%{opacity:.4}}
.setup{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 40px) 20px 40px}
.setup .logo{width:72px;height:72px;border-radius:20px;margin-bottom:18px;box-shadow:var(--shadow)}
.setup h1{font-size:26px;letter-spacing:-.02em;margin:0 0 8px}
.setup p{color:var(--mut);line-height:1.5;font-size:14.5px;margin:0 0 18px}
.steps{padding-left:20px;margin:0;color:var(--mut);font-size:14px;line-height:1.6}
.steps b{color:var(--tx)}
@media (prefers-reduced-motion:reduce){.view,.sheet,.sheetbg,.spin,.skel{animation:none}.toast{transition:none}}
[hidden]{display:none!important}
/* layar pembuka */
.splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--bg);transition:opacity .45s ease,visibility .45s}
.splash.out{opacity:0;visibility:hidden}
.splash .mark{width:112px;height:112px;border-radius:30px;background:#111;border:1px solid rgba(255,255,255,.08);box-shadow:var(--shadow);overflow:hidden;animation:splashIn .7s cubic-bezier(.2,.8,.2,1) both}
.splash .mark svg,.splash .mark img{display:block;width:100%;height:100%;object-fit:cover}
.splash .name{font-weight:700;font-size:24px;letter-spacing:-.02em;animation:splashIn .7s .12s cubic-bezier(.2,.8,.2,1) both}
@keyframes splashIn{from{opacity:0;transform:translateY(10px) scale(.94)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.splash .mark,.splash .name{animation:none}.splash{transition:none}}
/* perlu dicek */
.banner .bc{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 0 0;font:inherit;font-weight:700;color:var(--mint);cursor:pointer}
.revitem{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:var(--s2)}
.revtext{font-size:14px;font-weight:600;line-height:1.35;word-break:break-word}
.revmeta{font-size:12px;color:var(--mut);margin-top:6px}
.revbtns{display:flex;gap:8px;margin-top:10px}
.revbtns .btn{margin:0;flex:1;padding:10px 12px;font-size:14px}
.revnote{background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--mut);margin:0 0 12px;word-break:break-word}
.revnote b{color:var(--tx);display:block;font-size:12px;margin-bottom:3px}
/* dompet & ringkasan mingguan */
.wkrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wkrow .k{font-size:11px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.wkrow .v{font-size:19px;font-weight:500;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wkmeta{font-size:12px;color:var(--mut);margin-top:10px;line-height:1.45}
.methods{display:flex;flex-direction:column;gap:12px}
.mth{display:flex;align-items:center;gap:10px}
.mthico{width:38px;height:38px;border-radius:12px;background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.mthmain{flex:1;min-width:0}
.mthname{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mthbar{height:6px;border-radius:6px;background:var(--s2);overflow:hidden;margin:5px 0 3px}
.mthbar span{display:block;height:100%;border-radius:6px}
.mthsub{font-size:11px;color:var(--mut)}
.mthval{font-size:13px;font-weight:500;white-space:nowrap}
.drop summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
.drop summary::-webkit-details-marker{display:none}
.drop summary .chev{transition:transform .2s;font-size:16px}
.drop[open] summary .chev{transform:rotate(90deg)}
.drop summary:focus-visible{outline:2px solid var(--mint);outline-offset:4px;border-radius:6px}
.lsum{display:flex;gap:16px;font-size:12px;color:var(--mut);margin:12px 0 6px}
/* kartu kredit bertumpuk */
.ccdeck{position:relative;margin:6px 0 4px}
.cc{position:absolute;left:0;right:0;top:0;height:184px;border-radius:18px;padding:15px 18px;color:#fff;
  display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;cursor:pointer;
  box-shadow:0 12px 26px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.16);transform-origin:top center;
  transition:transform .38s cubic-bezier(.2,.8,.2,1),box-shadow .3s,opacity .3s}
.cc::before{content:'';position:absolute;inset:-40% -25%;pointer-events:none;
  background:linear-gradient(115deg,transparent 32%,rgba(255,255,255,.14) 48%,transparent 62%)}
.cc::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(130% 90% at 100% 0%,rgba(255,255,255,.18),transparent 58%)}
.cc.front{box-shadow:0 18px 34px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.2)}
.cc-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1}
.cc-brand{display:inline-flex;align-items:center;justify-content:center;background:#fff;border-radius:7px;padding:5px 8px;min-height:26px;box-shadow:0 2px 5px rgba(0,0,0,.2)}
.cc-logo{height:15px;width:auto;max-width:118px;display:block}
.cc-bank{font-weight:800;letter-spacing:.08em;font-size:13px;line-height:1;color:#052659}
.cc-kind{font-size:9px;letter-spacing:.2em;text-transform:uppercase;opacity:.82;margin-top:3px}
.cc-wave{display:flex;gap:3px;align-items:flex-end;opacity:.85;height:20px}
.cc-wave i{display:block;width:3px;border-radius:2px;background:currentColor}
.cc-wave i:nth-child(1){height:8px}.cc-wave i:nth-child(2){height:12px}.cc-wave i:nth-child(3){height:16px}.cc-wave i:nth-child(4){height:20px}
.cc-mid{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.cc-chip{width:38px;height:28px;border-radius:6px;position:relative;flex:none;
  background:linear-gradient(135deg,#f3d791,#c99a3f 60%,#e8c37a);box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.cc-chip::before{content:'';position:absolute;inset:6px 7px;border:1px solid rgba(0,0,0,.3);border-radius:3px}
.cc-chip::after{content:'';position:absolute;left:5px;right:5px;top:50%;border-top:1px solid rgba(0,0,0,.22)}
.cc-num{font-family:'DM Mono',ui-monospace,monospace;font-size:12.5px;letter-spacing:.2em;opacity:.9}
.cc-bot{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;position:relative;z-index:1}
.cc-lbl{font-size:9px;letter-spacing:.14em;text-transform:uppercase;opacity:.78}
.cc-val{font-size:16px;font-weight:700;font-family:'DM Mono',ui-monospace,monospace;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:44vw}
@media (max-width:360px){.cc-bank{font-size:14px}.cc-val{font-size:13px}.cc-num{font-size:11px;letter-spacing:.14em}}
.cc-bca{background:linear-gradient(135deg,#003b73,#0a63c4 58%,#0a4f9e)}
.cc-danamon{background:linear-gradient(135deg,#7f0a10,#d92b2b 60%,#a80f18)}
.cc-bni{background:linear-gradient(135deg,#9a3412,#f97316 55%,#c2410c)}
.cc-dbs{background:linear-gradient(135deg,#0b0b0b,#242424 60%,#3a3a3a);box-shadow:0 12px 26px rgba(0,0,0,.5),inset 0 0 0 1px rgba(236,28,36,.55)}
.cc-octo{background:linear-gradient(135deg,#5E0014,#B00022 62%,#7A0019)}
.cc-mandiri{background:linear-gradient(135deg,#06305e,#14539b 60%,#0b3f77)}
.cc-other{background:linear-gradient(135deg,#052659,#5483B3 65%,#0A3E7A)}
.cc.cc-empty{filter:saturate(.72) brightness(.94)}
.cc-hint{font-size:11px;color:var(--mut);text-align:center;margin-top:6px}
.cc-dots{display:flex;gap:6px;justify-content:center;margin-top:12px}
.cc-dots i{width:6px;height:6px;border-radius:50%;background:var(--line);transition:background .2s,transform .2s}
.cc-dots i.on{background:var(--mint);transform:scale(1.3)}
/* kunci PIN */
.lock{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.lockbox{width:100%;max-width:300px;text-align:center}
.lockico{width:64px;height:64px;border-radius:18px;box-shadow:var(--shadow)}
.lockttl{font-weight:700;font-size:20px;margin-top:14px}
.locksub{font-size:13px;color:var(--mut);margin:6px 0 18px}
.lockbox input{width:100%;text-align:center;font-size:26px;letter-spacing:.35em;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--s1);color:var(--tx)}
.lockbox input:focus{outline:2px solid var(--mint);outline-offset:1px}
</style>
</head>
<body>
<div class="splash" id="splash" aria-hidden="true">
  <div class="mark"><img src="icons/icon-192.png" alt=""></div>
  <div class="name">Catat Panda</div>
</div>
<header class="hdr" id="hdr" hidden>
  <div class="monthbar">
    <button id="prev" aria-label="Previous month">‹</button>
    <div class="lbl">Catat Panda<small id="monthLabel">…</small></div>
    <button id="next" aria-label="Next month">›</button>
  </div>
  <span class="chip" id="streak">🔥 –</span>
</header>
<div class="ptr" id="ptr">↓ Pull to refresh</div>
<main id="view" class="view"></main>

<nav class="tabbar" id="tabbar" hidden aria-label="Main menu">
  <button class="tab on" data-tab="ringkasan"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v9h9"/></svg><span>Overview</span></button>
  <button class="tab" data-tab="transaksi"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r=".8"/><circle cx="4.5" cy="12" r=".8"/><circle cx="4.5" cy="18" r=".8"/></svg><span>Transactions</span></button>
  <button class="add" id="fab" aria-label="Add transaction">+</button>
  <button class="tab" data-tab="dompet"><svg viewBox="0 0 24 24"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H18v3"/><path d="M3 7.5V18a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2H5.5A2.5 2.5 0 0 1 3 7.5z"/><circle cx="16.5" cy="14" r="1.2"/></svg><span>Wallet</span></button>
  <button class="tab" data-tab="setelan"><svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg><span>Settings</span></button>
</nav>

<div class="sheetbg" id="sheetBg" hidden></div>
<section class="sheet" id="sheetAdd" hidden aria-label="Add transaction">
  <div class="grab"></div>
  <h3><span id="addTitle">Add transaction</span><button class="iconbtn" data-close aria-label="Close">✕</button></h3>
  <div class="revnote" id="revNote" hidden></div>
  <div class="seg" id="segTipe"><button data-v="Keluar" class="on">Expense</button><button data-v="Masuk">Income</button></div>
  <div class="amtbox"><span>Rp</span><input id="amt" class="mono" inputmode="numeric" placeholder="0" autocomplete="off"></div>
  <div class="quick" id="quick"><button data-v="15000">15.000</button><button data-v="25000">25.000</button><button data-v="50000">50.000</button><button data-v="100000">100.000</button></div>
  <div class="fld"><label for="desc">What for?</label><input id="desc" maxlength="80" placeholder="e.g. Lunch" autocomplete="off"></div>
  <div class="fld"><label for="kat">Category</label><select id="kat"></select></div>
  <div id="loanBox" hidden>
    <div class="fld"><label for="nama">Person</label><input id="nama" maxlength="40" placeholder="e.g. Budi" autocomplete="off"></div>
    <div class="seg" id="segJenis"><button data-v="Hutang">Debt (I borrowed)</button><button data-v="Piutang">Receivable (I lent)</button></div>
    <div class="hint" id="loanHint"></div>
  </div>
  <div class="row2 m">
    <div class="fld"><label for="met">Method</label><select id="met"></select></div>
    <div class="fld"><label for="tgl">Date</label><input id="tgl" type="date"></div>
  </div>
  <label class="chk" id="rememberBox" hidden><input type="checkbox" id="remember" checked><span>Remember this category for the same merchant</span></label>
  <div class="err" id="formErr"></div>
  <button class="btn" id="save">Save</button>
</section>
<section class="sheet" id="sheetDetail" hidden aria-label="Transaction details"></section>
<div class="lock" id="lock" hidden>
  <div class="lockbox">
    <img class="lockico" src="icons/icon-192.png" alt="">
    <div class="lockttl">Catat Panda</div>
    <div class="locksub">Enter your PIN to unlock</div>
    <input id="pin" class="mono" type="password" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="••••">
    <div class="err" id="pinErr"></div>
    <button class="btn" id="pinGo">Unlock</button>
    <button class="btn ghost" id="pinForget" style="margin-top:8px">Forgot PIN</button>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  'use strict';
  var VERSION = '2.6';
  // Notifikasi push dilayani Cloudflare Worker di folder worker/ (lihat worker/README.md).
  // Setelah Worker di-deploy, isi dengan alamatnya, contoh:
  //   var PUSH_ENDPOINT = 'https://catat-panda-push.budi.workers.dev/api/push';
  // Selama kosong, kartu Notifikasi hanya menjelaskan bahwa fitur ini butuh server.
  var PUSH_ENDPOINT = '';
  function $(id) { return document.getElementById(id); }
  var LS = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
  };
  function pj(s, d) { try { return JSON.parse(s); } catch (e) { return d; } }
  var ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ESC[c]; }); }
  function grp(n) { return String(Math.abs(Math.round(n))).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
  function rp(n) { n = Math.round(Number(n) || 0); return (n < 0 ? '−' : '') + 'Rp ' + grp(n); }
  function short(n) {
    n = Math.abs(n);
    if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 1 : 2).replace('.', ',') + 'M';
    if (n >= 1e3) return Math.round(n / 1e3) + 'K';
    return String(n);
  }
  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  function dlabel(d) { return parseInt(d.slice(8, 10), 10) + ' ' + MON[parseInt(d.slice(5, 7), 10) - 1]; }
  function prevDay(d) { var x = new Date(d + 'T00:00:00Z'); x.setUTCDate(x.getUTCDate() - 1); return x.toISOString().slice(0, 10); }
  function dayHeader(d, today) {
    if (d === today) return 'Today';
    if (d === prevDay(today)) return 'Yesterday';
    return DOW[new Date(d + 'T00:00:00Z').getUTCDay()] + ', ' + dlabel(d);
  }
  var COLORS = ['#5AA9FF', '#3DDC97', '#F2B84B', '#FF7B6F', '#B28DFF', '#4FD1D9', '#FF9AD5', '#A3E635', '#FB923C', '#94A3B8'];
  var SRC = { form: 'Tally form', app: 'This app', notif: 'Bank notification (auto)' };

  var state = {
    url: LS.get('ck_url', ''), token: LS.get('ck_token', ''),
    tab: 'ringkasan', month: '', data: null, fromCache: false, busy: false,
    push: { supported: false, on: false, denied: false, busy: false },
    filter: 'semua', q: '', tipe: 'Keluar', jenis: '', reqId: '', setupMsg: '', editId: '', extraCat: '',
    pending: pj(LS.get('ck_pending', '[]'), []), lastSync: LS.get('ck_sync', ''), prevKeluar: 0,
    review: null, reviewRow: '', search: null, cardActive: 0
  };
  var flushing = false;

  function toast(msg) { var t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(function () { t.classList.remove('show'); }, 2600); }
  function persistPending() { LS.set('ck_pending', JSON.stringify(state.pending)); }
  function connected() { return !!(state.url && state.token); }
  function todayStr() { return (state.data && state.data.today) || new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Jakarta' }).format(new Date()); }
  function setSpin(on) { var c = $('streak'); if (state.data) c.innerHTML = (on ? '<span class="spin">⟳</span> ' : '🔥 ') + state.data.streak + (on ? '' : ' days'); }

  // ================= jaringan =================
  function api(action, payload) {
    var ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = ctl ? setTimeout(function () { ctl.abort(); }, 30000) : null;
    var body = JSON.stringify(Object.assign({ action: action, token: state.token }, payload || {}));
    return fetch(state.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: body, redirect: 'follow', signal: ctl ? ctl.signal : undefined })
      .then(function (res) { if (timer) clearTimeout(timer); return res.text(); })
      .then(function (t) {
        try { return JSON.parse(t); } catch (e) { var er = new Error('BADRESP'); er.code = 'BADRESP'; throw er; }
      })
      .catch(function (e) {
        if (timer) clearTimeout(timer);
        if (e && e.code === 'BADRESP') throw e;
        var er = new Error('NET'); er.code = 'NET'; throw er;
      });
  }
  function cacheKey(m) { return 'ck_cache_v2_' + m; }
  // Simpan hanya beberapa bulan terakhir; sisanya dibuang supaya localStorage tidak membengkak.
  function pruneCache(keep) {
    try {
      var keys = [], i, k;
      for (i = 0; i < localStorage.length; i++) { k = localStorage.key(i); if (k && k.indexOf('ck_cache_') === 0) keys.push(k); }
      keys.sort();
      var excess = keys.length - (keep || 6);
      for (i = 0; i < excess; i++) localStorage.removeItem(keys[i]);
    } catch (e) {}
  }

  function loadMonth(month, opts) {
    opts = opts || {};
    if (!connected()) return renderAll();
    if (!opts.silent) {
      var key = cacheKey(month || LS.get('ck_lastmonth', ''));
      var c = pj(LS.get(key, ''), null);
      if (c) { state.data = c; state.month = c.month; state.fromCache = true; }
      else if (month) state.data = null;
      renderAll();
    }
    if (state.busy) return;
    state.busy = true; setSpin(true);
    return api('data', { month: month || '' }).then(function (d) {
      state.busy = false;
      if (!d || d.ok === false) {
        if (d && d.error === 'auth') { state.setupMsg = 'Secret code rejected. Please check again.'; return goSetup(); }
        setSpin(false); return fail((d && d.error) || 'Could not load data');
      }
      state.data = d; state.month = d.month; state.fromCache = false;
      LS.set(cacheKey(d.month), JSON.stringify(d)); pruneCache(6);
      if (!month) LS.set('ck_lastmonth', d.month);
      state.lastSync = new Date().toISOString(); LS.set('ck_sync', state.lastSync);
      renderAll(); flushPending();
    }).catch(function (e) {
      state.busy = false; setSpin(false);
      if (e.code === 'NET') {
        state.fromCache = !!state.data; renderAll();
        if (!state.data) fail('No connection and nothing saved on this phone yet.');
        else if (opts.manual) toast('Offline — showing saved data');
        return;
      }
      fail('The Web App did not respond correctly. Check the URL and make sure deployment access is "Anyone".');
    });
  }

  function fail(msg) {
    if (state.tab === 'setelan') return toast(msg);
    $('view').innerHTML = '<div class="card"><div style="font-weight:700;margin-bottom:6px">Could not load</div><div class="empty">' + esc(msg) + '</div><button class="btn" data-act="retry" style="margin-top:12px">Try again</button></div>';
  }

  // ================= antrean offline =================
  function flushPending() {
    if (flushing || !state.pending.length || !connected()) return;
    flushing = true;
    var p = state.pending[0];
    api('add', p).then(function (r) {
      flushing = false;
      if (r && r.error === 'auth') return;
      state.pending.shift(); persistPending();
      if (r && r.ok === false) toast('Entry "' + p.desc + '" rejected: ' + r.error);
      if (state.pending.length) flushPending();
      else { toast('✅ Offline entries sent'); loadMonth(state.month, { silent: true }); }
    }).catch(function () { flushing = false; });
  }

  // ================= grafik =================
  function donut(cats, total) {
    var R = 44, C = 2 * Math.PI * R, off = 0, segs = '';
    cats.forEach(function (c, i) {
      var len = total ? c.amount / total * C : 0, gap = cats.length > 1 ? 1.6 : 0;
      segs += '<circle cx="60" cy="60" r="' + R + '" fill="none" stroke="' + COLORS[i % COLORS.length] + '" stroke-width="15" stroke-dasharray="' +
        Math.max(len - gap, 0.1).toFixed(2) + ' ' + C.toFixed(2) + '" stroke-dashoffset="' + (-off).toFixed(2) + '" transform="rotate(-90 60 60)"/>';
      off += len;
    });
    return '<svg viewBox="0 0 120 120" role="img" aria-label="Spending by category"><circle cx="60" cy="60" r="' + R + '" fill="none" stroke="var(--s2)" stroke-width="15"/>' + segs +
      '<text x="60" y="57" text-anchor="middle" font-size="9" fill="var(--mut)">Total</text><text x="60" y="73" text-anchor="middle" font-size="15" font-weight="500" fill="var(--tx)" class="mono">' + esc(short(total)) + '</text></svg>';
  }
  function trendSvg(tr) {
    var max = 1; tr.forEach(function (t) { max = Math.max(max, t.masuk, t.keluar); });
    var W = 320, H = 150, base = 124, top = 14, gw = W / tr.length, bw = 13, out = '';
    tr.forEach(function (t, i) {
      var cx = gw * i + gw / 2;
      var hm = Math.max(t.masuk / max * (base - top), t.masuk ? 2 : 0), hk = Math.max(t.keluar / max * (base - top), t.keluar ? 2 : 0);
      out += '<rect x="' + (cx - bw - 1.5) + '" y="' + (base - hm) + '" width="' + bw + '" height="' + hm + '" rx="4" fill="var(--mint)"/>';
      out += '<rect x="' + (cx + 1.5) + '" y="' + (base - hk) + '" width="' + bw + '" height="' + hk + '" rx="4" fill="var(--coral)"/>';
      out += '<text x="' + cx + '" y="142" text-anchor="middle" font-size="11" fill="' + (i === tr.length - 1 ? 'var(--tx)' : 'var(--mut)') + '">' + esc(t.label) + '</text>';
    });
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="Income and spending, last 6 months"><line x1="0" x2="' + W + '" y1="' + base + '" y2="' + base + '" stroke="var(--line)"/>' + out + '</svg>';
  }

  // ================= layar =================
  function isIOS() { return /iphone|ipad|ipod/i.test(navigator.userAgent); }
  function standalone() { return !!(window.navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches)); }

  function txRow(t) {
    var inc = t.tipe === 'Masuk' && !t.loan, cls = t.loan ? 'warn' : (inc ? 'pos' : '');
    var meta = dlabel(t.date) + (t.metode ? ' · ' + t.metode : '') + (t.loan && t.nama ? ' · ' + t.nama : '');
    return '<button class="tx" data-act="detail" data-id="' + esc(t.id) + '"><div class="ico">' + esc(t.emoji) + '</div><div class="m"><div class="d">' + esc(t.desc) +
      (t.flag ? '<span class="tag cek">check</span>' : (t.src === 'notif' ? '<span class="tag">auto</span>' : '')) + '</div><div class="s">' + esc(meta) + '</div></div>' +
      '<div class="a mono ' + cls + '">' + (inc ? '+' : '') + rp(t.amount) + '</div></button>';
  }
  function pendingRow(p, i) {
    var o = (state.data && state.data.options) || { emoji: {} };
    return '<div class="tx" style="cursor:default"><div class="ico">' + esc(o.emoji[p.kategori] || '🕓') + '</div><div class="m"><div class="d">' + esc(p.desc) +
      '<span class="tag cek">waiting</span></div><div class="s">' + esc(dlabel(p.tanggal) + ' · ' + p.metode) + '</div></div><div class="a mono">' + rp(p.amount) + '</div></div>';
  }

  function viewRingkasan(d) {
    var h = '', k = d.kpi, sel = k.selisih, isCur = d.month === d.today.slice(0, 7);
    if (isIOS() && !standalone() && LS.get('ck_hint', '') !== '1') {
      h += '<div class="banner info"><b>Install on your Home Screen.</b> Tap Share in Safari, then "Add to Home Screen". It opens like a normal app.<br><button data-act="hint-ok">Got it</button></div>';
    }
    if (state.pending.length) h += '<div class="banner"><b>' + state.pending.length + (state.pending.length === 1 ? ' entry is' : ' entries are') + ' waiting for signal.</b> They will be sent automatically once online.</div>';
    var rv = d.review || { pending: 0, items: [] }, need = (rv.pending || 0) + (d.flagged || 0);
    if (need > 0) {
      h += '<div class="banner"><b>' + need + ' automatic entries need review.</b> ';
      if (d.flagged) h += d.flagged + ' flagged for review this month. ';
      if (rv.pending) h += rv.pending + ' notifications could not be read.';

  // ================= notifikasi push =================
  function b64ToBytes(s) {
    var b = atob((s + '==='.slice((s.length + 3) % 4)).replace(/-/g, '+').replace(/_/g, '/')), a = new Uint8Array(b.length);

  }
  function pushApi(action, body) {

    return fetch(PUSH_ENDPOINT + '/' + action, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {})
      .then(function (r) {
        var ct = (r.headers && r.headers.get && r.headers.get('content-type')) || '';

        return r.json();

      if (!sub) return;
      return pushApi('unsubscribe', { endpoint: sub.endpoint }).catch(function () {}).then(function () { return sub.unsubscribe(); });
    }).then(function () { if (!quiet) pushDone('Notifications turned off'); }, function () { if (!quiet) pushDone('Could not turn notifications off'); });
  }

      return Promise.all([pushReg(), pushApi('key')]);

  }

  function countUp(el, from, to) {

    if (from === to || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
    var t0 = null, dur = 600;

    var s = 'ck:' + v;
    try {
      if (window.crypto && crypto.subtle && crypto.subtle.digest && window.TextEncoder) {
        crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)).then(function (buf) {
          cb(Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); }).join(''));
        }).catch(function () { cb(fallbackHash(s)); });
        return;
      }
    } catch (e) {}
    cb(fallbackHash(s));
  }

    }).catch(function () {
      if (!state.search || state.search.q !== q) return;
      state.search = { q: q, items: [], total: 0, loading: false, err: true };
      if (state.tab === 'transaksi' && $('txlist')) $('txlist').innerHTML = searchHtml();
    });
  }
  $('view').addEventListener('input', function (e) {
    if (e.target.id !== 'q') return;
    state.q = e.target.value;
    var q = state.q.trim();
    clearTimeout(searchTimer);
    if (q.length < 2) { state.search = null; if (state.data && $('txlist')) $('txlist').innerHTML = txListHtml(state.data); return; }
    searchTimer = setTimeout(function () { doSearch(q); }, 300);
  });
  $('sheetDetail').addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]'); if (!el) return;
    var act = el.getAttribute('data-act'), id = el.getAttribute('data-id');
    if (act === 'edit') openEdit(id);
    else if (act === 'flag-ok') {
      el.disabled = true; el.textContent = 'Marking…';
      api('flag_clear', { id: id }).then(function (r) {
        if (r && r.ok) { closeSheets(); toast('✅ Marked as checked'); loadMonth(state.month, { silent: true }); }
        else { el.disabled = false; el.textContent = 'Mark as checked'; toast((r && r.error) || 'Could not update the entry'); }
      }).catch(function () {
        el.disabled = false; el.textContent = 'Mark as checked'; toast('Cannot reach the server');
      });
    }
    else if (act === 'rev-add') openReviewAdd(Number(el.getAttribute('data-i')));
    else if (act === 'rev-del') reviewDiscard(Number(el.getAttribute('data-i')));
    else if (act === 'rev-bulk') {
      var zeros = (state.review || []).filter(function (x) { return !x.amount; });
      if (!zeros.length) return;
      if (!confirm('Dismiss ' + zeros.length + (zeros.length === 1 ? ' notification' : ' notifications') + ' without an amount?')) return;
      api('review_discard_bulk', { rows: zeros.map(function (x) { return x.row; }) }).then(function (res) {
        if (res && res.ok) {
          state.review = (state.review || []).filter(function (x) { return x.amount; });
          renderReview(); toast('🗑️ ' + (res.count || zeros.length) + ' notifications dismissed');
          loadMonth(state.month, { silent: true });
        } else toast((res && res.error) || 'Could not dismiss');
      }).catch(function () { toast('Cannot reach the server'); });
    }
    else if (act === 'del1') openDetail(id, true);
    else if (act === 'pin-save') {
      var p1 = $('pin1').value.trim(), p2 = $('pin2').value.trim();
      if (!/^\d{4,6}$/.test(p1)) { $('pinErr2').textContent = 'PIN must be 4–6 digits'; return; }
      if (p1 !== p2) { $('pinErr2').textContent = 'PINs do not match'; return; }
      pinHash(p1, function (hv) { LS.set('ck_pin', hv); closeSheets(); toast('🔒 PIN enabled'); renderAll(); });
    }
    else if (act === 'del0') openDetail(id, false);
    else if (act === 'del2') {
      el.disabled = true; el.textContent = 'Menghapus…';
      api('delete', { id: id }).then(function (r) {
        if (r && r.ok) { closeSheets(); toast('🗑️ ' + (r.msg || 'Dihapus')); loadMonth(state.month, { silent: true }); }
        else { $('delErr').textContent = (r && r.error) || 'Could not delete'; el.disabled = false; el.textContent = 'Yes, delete this entry'; }
      }).catch(function (e2) { $('delErr').textContent = e2.code === 'NET' ? 'You need internet to delete.' : 'Delete failed.'; el.disabled = false; el.textContent = 'Yes, delete this entry'; });
    }
  });

  function setTab(t) { state.tab = t; if (t !== 'setelan' && !state.data) loadMonth(state.month); else renderAll(); window.scrollTo(0, 0); }
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (b) { b.addEventListener('click', function () { setTab(b.getAttribute('data-tab')); }); });
  function clearSearch() { state.q = ''; state.search = null; }
  $('prev').addEventListener('click', function () { if (state.data && state.data.prev) { clearSearch(); loadMonth(state.data.prev); } });
  $('next').addEventListener('click', function () { if (state.data && state.data.next) { clearSearch(); loadMonth(state.data.next); } });

  function connect() {
    var url = $('sUrl').value.trim().replace(/\/macros\/u\/\d+\/s\//, '/macros/s/'), tok = $('sTok').value.trim();
    if (!/^https:\/\/script\.google\.com\/(a\/macros\/[^/]+\/)?macros\/s\/[^/]+\/exec$/.test(url)) { $('sErr').textContent = 'The address must look like https://script.google.com/macros/s/…/exec'; return; }
    if (!tok) { $('sErr').textContent = 'Enter the secret code'; return; }
    var go = $('sGo'); go.disabled = true; go.textContent = 'Menghubungkan…'; $('sErr').textContent = '';
    state.url = url; state.token = tok;
    api('data', { month: '' }).then(function (d) {
      go.disabled = false; go.textContent = 'Hubungkan';
      if (d && d.ok) {
        LS.set('ck_url', url); LS.set('ck_token', tok); state.setupMsg = ''; state.data = d; state.month = d.month; state.fromCache = false;
        LS.set(cacheKey(d.month), JSON.stringify(d)); pruneCache(6); LS.set('ck_lastmonth', d.month); state.lastSync = new Date().toISOString(); LS.set('ck_sync', state.lastSync);
        state.tab = 'ringkasan'; renderAll(); toast('✅ Connected');
      } else { state.token = ''; $('sErr').textContent = d && d.error === 'auth' ? 'Wrong secret code.' : ((d && d.error) || 'Could not connect'); }
    }).catch(function (e) {
      go.disabled = false; go.textContent = 'Hubungkan'; state.token = '';
      $('sErr').textContent = e.code === 'NET' ? 'Could not connect. Check your connection and the URL, and make sure deployment access is "Anyone".' : 'That address did not answer like a proper Web App. Please check the URL again.';
    });
  }

  // tarik untuk muat ulang
  var ptrY = null, ptrDy = 0;
  document.addEventListener('touchstart', function (e) { ptrY = (window.scrollY <= 0 && e.touches.length === 1 && !sheetOpen() && connected()) ? e.touches[0].clientY : null; ptrDy = 0; }, { passive: true });
  document.addEventListener('touchmove', function (e) {
    if (ptrY == null) return; ptrDy = e.touches[0].clientY - ptrY;
    if (ptrDy > 8) { var p = $('ptr'); p.style.transform = 'translateY(' + Math.min(ptrDy * 0.4, 46) + 'px)'; p.style.opacity = Math.min(ptrDy / 90, 1); p.textContent = ptrDy > 90 ? '↑ Release to refresh' : '↓ Pull to refresh'; }
  }, { passive: true });
  document.addEventListener('touchend', function () {
    var p = $('ptr'); p.style.opacity = 0; p.style.transform = '';
    if (ptrY != null && ptrDy > 90) { toast('Reloading…'); loadMonth(state.month, { silent: true, manual: true }); }
    ptrY = null; ptrDy = 0;
  });

  // Bulan hanya berpindah lewat tombol ‹ › (gestur geser dihapus: bertabrakan dengan kartu & mudah tersenggol).
  var monthLbl = document.querySelector('.monthbar .lbl');
  if (monthLbl) monthLbl.addEventListener('click', function () {
    if (!state.data) return;
    if (state.month !== state.data.today.slice(0, 7)) { clearSearch(); loadMonth(''); toast('Back to this month'); }
  });

  window.addEventListener('online', function () { flushPending(); if (connected()) loadMonth(state.month, { silent: true }); });
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && connected() && !state.busy && !sheetOpen() && state.tab !== 'setelan' && (!state.lastSync || Date.now() - new Date(state.lastSync).getTime() > 30000)) loadMonth(state.month, { silent: true });
  });
  if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  refreshPush();

  // layar pembuka: tampil sebentar lalu memudar
  var splashAt = Date.now();
  function hideSplash() {
    var sp = $('splash'); if (!sp || sp.classList.contains('out')) return;
    setTimeout(function () { sp.classList.add('out'); setTimeout(function () { sp.remove(); }, 500); }, Math.max(0, 1200 - (Date.now() - splashAt)));
  }
  if (document.readyState === 'complete') hideSplash(); else window.addEventListener('load', hideSplash);
  setTimeout(hideSplash, 2500);

  // mulai
  if (LS.get('ck_pin', '')) lockNow();
  if (connected()) loadMonth(''); else renderAll();
})();
</script>
</body>
</html>
