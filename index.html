<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" id="themeMeta" content="#F4F7FB">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bamboo">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Bamboo, Finance Tracker</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Reset khusus: elemen kartu kini tombol, tampilannya tetap dari kelasnya */
.cchit{position:absolute;inset:0;width:100%;height:100%;background:none;border:0;padding:0;margin:0;
  border-radius:18px;cursor:pointer;-webkit-appearance:none;appearance:none}
.cchit:focus-visible{outline:2px solid var(--mint);outline-offset:-4px}
:where(button.catrowitem, button.goal){
  border:0; padding:0; margin:0; font:inherit; color:inherit; text-align:left;
  background:none; appearance:none; -webkit-appearance:none; width:100%; cursor:pointer;
}
:where(button.catrowitem, button.goal):focus-visible{
  outline:2px solid var(--mint); outline-offset:3px; border-radius:16px;
}
:root{
  --bg:#021024; --s1:rgba(193,232,255,.06); --s2:rgba(193,232,255,.10); --line:rgba(193,232,255,.13);
  --tx:#E9F4FF; --mut:#8FB3D9;
  --mint:#C1E8FF; --mint-ink:#03172E; --coral:#FFB0A3; --amber:#F3D2A6;
  --shadow:0 18px 40px rgba(1,8,20,.55);
  --card:linear-gradient(160deg,rgba(193,232,255,.10),rgba(193,232,255,.045));
  --sheet-bg:#0B1726; --sheet-line:rgba(193,232,255,.18);
  --tabbg:linear-gradient(180deg,rgba(193,232,255,.12),rgba(193,232,255,.05));
  --glass:blur(11px) saturate(118%);
  font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
body.dark{ --bg:#021024; --s1:rgba(193,232,255,.06); --s2:rgba(193,232,255,.10); --line:rgba(193,232,255,.13);
  --tx:#E9F4FF; --mut:#8FB3D9; --mint:#C1E8FF; --mint-ink:#03172E; --coral:#FFB0A3; --amber:#F3D2A6;
  --shadow:0 18px 40px rgba(1,8,20,.55);
  --card:linear-gradient(160deg,rgba(193,232,255,.10),rgba(193,232,255,.045));
  --tabbg:linear-gradient(180deg,rgba(193,232,255,.12),rgba(193,232,255,.05));
  background:radial-gradient(60% 44% at 4% -14%, rgba(84,131,179,.22), transparent 62%),
     radial-gradient(46% 34% at 108% -8%, rgba(193,232,255,.16), transparent 62%),
     radial-gradient(78% 50% at 50% 110%, rgba(125,160,202,.22), transparent 64%), #021024; background-attachment:fixed }
body.light{
  --bg:#F4F7FB; --s1:rgba(10,24,38,.035); --s2:rgba(10,24,38,.06); --line:rgba(10,24,38,.12);
  --tx:#0B1B2B; --mut:#5C7488;
  --mint:#2F6FB2; --mint-ink:#FFFFFF; --coral:#C0392B; --amber:#A9761A;
  --shadow:0 12px 30px rgba(12,32,52,.10);
  --card:#FFFFFF; --tabbg:#FFFFFF;
  --sheet-bg:#FFFFFF; --sheet-line:rgba(10,24,38,.12);
  background:radial-gradient(60% 40% at 50% -12%, rgba(84,131,179,.18), transparent 62%), #F4F7FB;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#EAF3FC; --s1:rgba(255,255,255,.74); --s2:rgba(255,255,255,.58); --line:rgba(5,38,89,.12);
         --tx:#04182F; --mut:#4F6C8F; --mint:#0B4F8A; --mint-ink:#FFFFFF; --coral:#B4442F; --amber:#8A5A0B;
         --shadow:0 18px 40px rgba(5,38,89,.16); }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg)}
body{color:var(--tx);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;-webkit-text-size-adjust:100%;min-height:100vh;
  background:
    radial-gradient(64% 46% at 6% -12%, rgba(84,131,179,.38), transparent 62%),
    radial-gradient(52% 38% at 104% -4%, rgba(125,160,202,.26), transparent 60%),
    radial-gradient(78% 50% at 50% 110%, rgba(5,38,89,.85), transparent 64%),
    var(--bg);
  background-attachment:fixed}
@media (prefers-color-scheme: light){
  body{background:
    radial-gradient(64% 46% at 6% -12%, rgba(84,131,179,.34), transparent 62%),
    radial-gradient(52% 38% at 104% -4%, rgba(193,232,255,.60), transparent 60%),
    radial-gradient(78% 50% at 50% 110%, rgba(125,160,202,.22), transparent 64%),
    var(--bg);background-attachment:fixed}
}
.mono{font-family:'DM Mono',ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.hdr{position:sticky;top:0;z-index:15;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 12px 10px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 78%,transparent),color-mix(in srgb,var(--bg) 55%,transparent));
  backdrop-filter:blur(13px) saturate(120%);-webkit-backdrop-filter:blur(13px) saturate(120%)}
.monthbar{display:flex;align-items:center;gap:4px;flex:1;min-width:0}
.monthbar button{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--s1);font-size:22px;line-height:1;cursor:pointer;flex:none;touch-action:manipulation;display:flex;align-items:center;justify-content:center}
.monthbar button:active{background:var(--s2);transform:scale(.96)}
.monthbar button:disabled{opacity:.3}
.monthbar .lbl{font-weight:700;font-size:18px;letter-spacing:-.01em;flex:1;text-align:center;white-space:nowrap;line-height:1.15;min-width:0}
.monthbar .lbl small{display:block;font-weight:500;font-size:12px;letter-spacing:0;color:var(--mut)}
.chip{background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:7px 11px;font-size:13px;font-weight:500;white-space:nowrap;flex:none}
.spin{display:inline-block;animation:rot .9s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.ptr{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 74px);text-align:center;font-size:12px;color:var(--mut);opacity:0;pointer-events:none;z-index:14}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.05;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>")}
.view{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:6px 16px calc(120px + env(safe-area-inset-bottom,0px));animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.view > *{animation:rise .34s cubic-bezier(.2,.8,.2,1) both}
.view > *:nth-child(2){animation-delay:.03s}.view > *:nth-child(3){animation-delay:.06s}
.view > *:nth-child(4){animation-delay:.09s}.view > *:nth-child(5){animation-delay:.12s}
.view > *:nth-child(6){animation-delay:.15s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view > *{animation:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:18px;margin-bottom:14px;
  box-shadow:0 12px 32px rgba(1,8,20,.35),inset 0 1px 0 rgba(193,232,255,.09)}
.card h2{margin:0 0 14px;font-size:13.5px;font-weight:700;letter-spacing:-.01em;text-transform:none;color:var(--tx);display:flex;justify-content:space-between;align-items:center;position:relative;padding-left:11px}
.card h2::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:14px;border-radius:2px;background:linear-gradient(180deg,var(--mint),#5483B3)}
.card h2 a{font-size:12px;letter-spacing:0;text-transform:none;color:var(--mint);font-weight:500;background:none;border:none;cursor:pointer;padding:0}
.hero .k{font-size:12px;letter-spacing:.09em;color:var(--mut);font-weight:700;text-transform:uppercase}
.hero .big{font-size:38px;font-weight:500;margin:6px 0 2px;letter-spacing:-.025em}
.hero2{position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.14);
  background:linear-gradient(150deg,#052659 0%,#0A3E7A 48%,#5483B3 100%);
  box-shadow:0 18px 40px rgba(2,16,36,.55),inset 0 1px 0 rgba(193,232,255,.22)}
.hero2::before{content:'';position:absolute;inset:-30% -20%;pointer-events:none;
  background:radial-gradient(55% 55% at 82% 8%,rgba(193,232,255,.30),transparent 62%),radial-gradient(45% 45% at 6% 92%,rgba(84,131,179,.55),transparent 62%)}
.hero2 .k,.hero2 .sub{color:rgba(255,255,255,.65)}
.hero2 .big{color:#fff;font-size:clamp(22px,6.4vw,28px);line-height:1.1;white-space:nowrap;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis}
.hero2{padding:14px 15px 12px}
.herochips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.herostats{display:flex;gap:8px;margin-top:11px}
.herostats .stat{flex:1;padding:8px 10px;border-radius:13px;min-width:0}
.herostats .stat .k{font-size:10px}
.herostats .stat .v{font-size:12.5px}
.hero2 .stat{background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.12)}
.hero2 .stat .k{color:rgba(255,255,255,.6)}
.hero2 .pos{color:#C1E8FF}.hero2 .neg{color:#FFC8BC}
.herochip{display:inline-flex;align-items:center;gap:5px;margin-top:12px;padding:5px 11px;border-radius:999px;
  background:rgba(255,255,255,.14);font-size:11.5px;font-weight:600;color:#fff}
.hero .sub{font-size:13px;color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.stat{background:var(--s2);border:1px solid var(--line);border-radius:16px;padding:11px 12px;min-width:0}
.stat .k{font-size:11px;color:var(--mut);font-weight:500}
.stat .v{font-size:13.5px;font-weight:600;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.pos{color:var(--mint)} .neg{color:var(--coral)} .warn{color:var(--amber)}
.banner{background:color-mix(in srgb,var(--amber) 14%,var(--s1));border:1px solid color-mix(in srgb,var(--amber) 45%,var(--line));border-radius:16px;padding:12px 14px;margin-bottom:14px;font-size:13.5px;line-height:1.45}
.banner b{color:var(--amber)} .banner details{margin-top:6px;color:var(--mut)} .banner li{margin:4px 0}
.banner button{margin-top:8px;border:1px solid var(--line);background:var(--s1);border-radius:10px;padding:6px 12px;font-size:13px;cursor:pointer}
.banner.info{background:color-mix(in srgb,var(--mint) 12%,var(--s1));border-color:color-mix(in srgb,var(--mint) 40%,var(--line))}
.banner.info b{color:var(--mint)}
.donutwrap{display:flex;align-items:center;gap:14px}
.donutwrap svg{width:128px;height:128px;flex:none}
.legend{flex:1;min-width:0}
.lg{display:flex;align-items:center;gap:8px;font-size:13px;padding:5px 0}
.lg .dot{width:9px;height:9px;border-radius:50%;flex:none}
.lg .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg .p{color:var(--mut);font-size:12px;min-width:38px;text-align:right}
.catrow{margin-top:14px;border-top:1px solid var(--line);padding-top:6px}
.cr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;font-size:14px}
.cr .a{font-size:13.5px}
.bar{height:5px;border-radius:5px;background:var(--s2);margin-top:2px;overflow:hidden}
.bar span{display:block;height:100%;border-radius:5px}
.legend2{display:flex;gap:14px;margin-top:6px;font-size:12px;color:var(--mut)}
.legend2 i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.tx{display:flex;align-items:center;gap:12px;padding:10px 0;border:none;border-top:1px solid var(--line);background:none;width:100%;text-align:left;cursor:pointer}
.tx:first-child{border-top:none}
.ico{width:42px;height:42px;border-radius:14px;background:var(--s2);display:grid;place-items:center;font-size:19px;flex:none;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.tx .m{flex:1;min-width:0}
.tx .d{font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .s{font-size:12px;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .a{font-size:14.5px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tag{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:6px;background:var(--s2);margin-left:6px;color:var(--mut);vertical-align:1px}
.tag.cek{background:color-mix(in srgb,var(--amber) 22%,transparent);color:var(--amber)}
.empty{color:var(--mut);font-size:14px;padding:6px 0}
.kv{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-top:1px solid var(--line);font-size:14px;gap:10px}
.kv:first-of-type{border-top:none}
.kv small{display:block;color:var(--mut);font-size:11.5px;margin-top:2px}
.day{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);font-weight:700;letter-spacing:.04em;padding:14px 2px 4px;text-transform:uppercase}
.day span.mono{text-transform:none;font-weight:500}
.search{width:100%;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-size:16px;color:var(--tx);font-family:inherit;margin-bottom:10px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.search::placeholder{color:var(--mut)}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;border:1px solid var(--line);background:var(--s1);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:500;cursor:pointer}
.filters button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
/* filter terstruktur */
.seg2{display:flex;gap:5px;background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:4px;margin:2px 0 8px}
.seg2 button{flex:1;border:0;background:none;padding:9px 4px;border-radius:11px;font:inherit;font-size:12.5px;font-weight:700;color:var(--mut);cursor:pointer}
.seg2 button.on{background:var(--card);color:var(--tx);box-shadow:0 2px 8px rgba(1,8,20,.10)}
.chiprow{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.fchip{flex:none;border:1px solid var(--line);background:var(--s1);color:var(--mut);border-radius:999px;
  padding:7px 12px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.fchip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.rangerow{display:flex;gap:8px;align-items:center;margin:0 0 10px}
.rangerow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--s1);color:var(--tx);
  border-radius:12px;padding:9px 10px;font:inherit;font-size:12.5px}
/* daftar transaksi: jarak & pemisah */
.txwrap + .txwrap{border-top:1px solid var(--line)}
.txwrap .tx{padding:10px 0}
.day{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:12px 4px 6px;font-size:11.5px;color:var(--mut);font-weight:600}
.day .cnt{font-weight:500;opacity:.8}
.tag.auto{opacity:.55;font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;background:none;border:0;padding:0 0 0 5px}
.tag.auto::before{content:''}
.fab{position:fixed;right:14px;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:21;width:48px;height:48px;border-radius:17px;border:none;background:linear-gradient(135deg,var(--mint),color-mix(in srgb,var(--mint) 42%,#052659));color:var(--mint-ink);font-size:25px;font-weight:500;box-shadow:0 12px 28px rgba(84,131,179,.45);cursor:pointer;transition:transform .15s}
.fab:active{transform:scale(.93)}
.add:active{transform:scale(.93)}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;animation:fadebg .2s}
@keyframes fadebg{from{opacity:0}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:540px;margin:0 auto;border-radius:28px 28px 0 0;border:1px solid var(--line);border-bottom:none;
  background:linear-gradient(180deg,rgba(5,38,89,.94),rgba(2,16,36,.97));
  backdrop-filter:blur(18px) saturate(130%);-webkit-backdrop-filter:blur(18px) saturate(130%);
  padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto;box-shadow:0 -10px 40px rgba(0,0,0,.5);animation:up .28s cubic-bezier(.2,.8,.2,1)}
body.light .sheet{background:linear-gradient(180deg,#FFFFFF,#F4F8FF);box-shadow:0 -10px 40px rgba(12,32,52,.18)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.grab{width:38px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:0 0 12px;font-size:18px;display:flex;justify-content:space-between;align-items:center}
.iconbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--s2);font-size:15px;cursor:pointer}
.seg{display:flex;background:var(--s2);border-radius:14px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;border:none;background:transparent;padding:10px 6px;border-radius:11px;font-weight:700;font-size:14px;cursor:pointer;color:var(--mut)}
.seg button.on{background:var(--tx);color:var(--bg)}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;color:var(--mut);margin-bottom:5px;font-weight:500}
.fld input,.fld select{width:100%;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:12px 13px;font-size:16px;color:var(--tx);font-family:inherit;appearance:none;-webkit-appearance:none;min-height:48px}
.amtbox{display:flex;align-items:center;gap:8px;background:var(--s2);border:1px solid var(--line);border-radius:16px;padding:6px 14px}
.amtbox span{color:var(--mut);font-size:18px}
.amtbox input{border:none;background:transparent;font-size:30px;padding:8px 0;outline:none!important;width:100%;color:var(--tx);min-height:0}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.quick button{border:1px solid var(--line);background:var(--s2);border-radius:999px;padding:8px 13px;font-size:13px;cursor:pointer}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2.m{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr)}
.row2.m input[type=date]{min-width:0}
.row2.m select,.row2.m input{font-size:15px;padding-left:12px;padding-right:8px}
.hint{font-size:12px;color:var(--mut);margin:-4px 0 12px}
.chk{display:flex;align-items:center;gap:10px;font-size:13.5px;margin:2px 0 8px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--mint);flex:none}
.btn{width:100%;border:none;background:linear-gradient(135deg,var(--mint),color-mix(in srgb,var(--mint) 42%,#052659));color:var(--mint-ink);font-weight:700;font-size:16px;padding:15px;border-radius:16px;cursor:pointer;margin-top:4px;
  box-shadow:0 10px 26px rgba(84,131,179,.35),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:disabled{opacity:.55}
.btn.ghost{background:var(--s2);color:var(--tx);border:1px solid var(--line);font-weight:500;box-shadow:none}
.btn.danger{background:color-mix(in srgb,var(--coral) 18%,var(--s2));color:var(--coral);border:1px solid color-mix(in srgb,var(--coral) 45%,var(--line))}
.err{color:var(--coral);font-size:13px;min-height:18px;margin:6px 2px 0}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.skel{height:14px;border-radius:7px;background:var(--s2);margin:10px 0;animation:p 1.2s ease-in-out infinite}
@keyframes p{50%{opacity:.4}}
.setup{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 40px) 20px 40px}
.setup .logo{width:72px;height:72px;border-radius:20px;margin-bottom:18px;box-shadow:var(--shadow)}
.setup h1{font-size:26px;letter-spacing:-.02em;margin:0 0 8px}
.setup p{color:var(--mut);line-height:1.5;font-size:14.5px;margin:0 0 18px}
.steps{padding-left:20px;margin:0;color:var(--mut);font-size:14px;line-height:1.6}
.steps b{color:var(--tx)}
@media (prefers-reduced-motion:reduce){.view,.sheet,.sheetbg,.spin,.skel{animation:none}.toast{transition:none}}
[hidden]{display:none!important}
/* layar pembuka */
.splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--bg);transition:opacity .45s ease,visibility .45s}
.splash.out{opacity:0;visibility:hidden}
.splash .mark{width:112px;height:112px;border-radius:30px;background:#111;border:1px solid rgba(255,255,255,.08);box-shadow:var(--shadow);overflow:hidden;animation:splashIn .7s cubic-bezier(.2,.8,.2,1) both}
.splash .mark svg,.splash .mark img{display:block;width:100%;height:100%;object-fit:cover}
.splash .name{font-weight:700;font-size:24px;letter-spacing:-.02em;animation:splashIn .7s .12s cubic-bezier(.2,.8,.2,1) both}
@keyframes splashIn{from{opacity:0;transform:translateY(10px) scale(.94)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.splash .mark,.splash .name{animation:none}.splash{transition:none}}
/* perlu dicek */
.banner .bc{display:block;width:100%;text-align:center;background:color-mix(in srgb,var(--mint) 14%,transparent);border:1px solid color-mix(in srgb,var(--mint) 38%,transparent);border-radius:14px;padding:11px 14px;margin-top:12px;font:inherit;font-weight:700;color:var(--mint);cursor:pointer}
.revitem{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:var(--s2)}
.revtext{font-size:14px;font-weight:600;line-height:1.35;word-break:break-word}
.revmeta{font-size:12px;color:var(--mut);margin-top:6px}
.revbtns{display:flex;gap:8px;margin-top:10px}
.revbtns .btn{margin:0;flex:1;padding:10px 12px;font-size:14px}
.revnote{background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--mut);margin:0 0 12px;word-break:break-word}
.revnote b{color:var(--tx);display:block;font-size:12px;margin-bottom:3px}
/* dompet & ringkasan mingguan */
.wkrow{display:grid;grid-template-columns:1.25fr 1fr 0.75fr;gap:8px;align-items:start}
.wkrow .k{font-size:10.5px;color:var(--mut);font-weight:600;letter-spacing:.02em}
.wkrow .v{font-size:13.5px;font-weight:700;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.wkrow .k{font-size:11px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.wkrow .v{font-size:19px;font-weight:500;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wkmeta{font-size:12px;color:var(--mut);margin-top:10px;line-height:1.45}
.methods{display:flex;flex-direction:column;gap:12px}
.mth{display:flex;align-items:center;gap:10px}
.mthico{width:38px;height:38px;border-radius:12px;background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.mthmain{flex:1;min-width:0}
.mthname{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mthbar{height:6px;border-radius:6px;background:var(--s2);overflow:hidden;margin:5px 0 3px}
.mthbar span{display:block;height:100%;border-radius:6px}
.mthsub{font-size:11px;color:var(--mut)}
.mthval{font-size:13px;font-weight:500;white-space:nowrap}
.drop summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
.drop summary::-webkit-details-marker{display:none}
.drop summary .chev{transition:transform .2s;font-size:16px}
.drop[open] summary .chev{transform:rotate(90deg)}
.drop summary:focus-visible{outline:2px solid var(--mint);outline-offset:4px;border-radius:6px}
.lsum{display:flex;gap:16px;font-size:12px;color:var(--mut);margin:12px 0 6px}
/* kartu kredit bertumpuk */
.ccdeck{position:relative;margin:6px 0 4px}
.cc{position:absolute;left:0;right:0;top:0;height:184px;border-radius:18px;padding:15px 18px;color:#fff;
  display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;cursor:pointer;
  box-shadow:0 12px 26px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.16);transform-origin:top center;
  transition:transform .38s cubic-bezier(.2,.8,.2,1),box-shadow .3s,opacity .3s}
.cc::before{content:'';position:absolute;inset:-40% -25%;pointer-events:none;
  background:linear-gradient(115deg,transparent 32%,rgba(255,255,255,.14) 48%,transparent 62%)}
.cc::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(130% 90% at 100% 0%,rgba(255,255,255,.18),transparent 58%)}
.cc.front{box-shadow:0 18px 34px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.2)}
.cc-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1}
.cc-brand{display:inline-flex;align-items:center;justify-content:center;background:#fff;border-radius:7px;padding:5px 8px;min-height:26px;box-shadow:0 2px 5px rgba(0,0,0,.2)}
.cc-logo{height:15px;width:auto;max-width:118px;display:block}
.cc-bank{font-weight:800;letter-spacing:.08em;font-size:13px;line-height:1;color:#052659}
.cc-kind{font-size:9px;letter-spacing:.2em;text-transform:uppercase;opacity:.82;margin-top:3px}
.cc-wave{display:flex;gap:3px;align-items:flex-end;opacity:.85;height:20px}
.cc-wave i{display:block;width:3px;border-radius:2px;background:currentColor}
.cc-wave i:nth-child(1){height:8px}.cc-wave i:nth-child(2){height:12px}.cc-wave i:nth-child(3){height:16px}.cc-wave i:nth-child(4){height:20px}
.cc-mid{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.cc-chip{width:38px;height:28px;border-radius:6px;position:relative;flex:none;
  background:linear-gradient(135deg,#f3d791,#c99a3f 60%,#e8c37a);box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.cc-chip::before{content:'';position:absolute;inset:6px 7px;border:1px solid rgba(0,0,0,.3);border-radius:3px}
.cc-chip::after{content:'';position:absolute;left:5px;right:5px;top:50%;border-top:1px solid rgba(0,0,0,.22)}
.cc-num{font-family:'DM Mono',ui-monospace,monospace;font-size:12.5px;letter-spacing:.2em;opacity:.9}
.cc-bot{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;position:relative;z-index:1}
.cc-lbl{font-size:9px;letter-spacing:.14em;text-transform:uppercase;opacity:.78}
.cc-val{font-size:16px;font-weight:700;font-family:'DM Mono',ui-monospace,monospace;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:44vw}
@media (max-width:360px){.cc-bank{font-size:14px}.cc-val{font-size:13px}.cc-num{font-size:11px;letter-spacing:.14em}}
.cc-bca{background:linear-gradient(135deg,#003b73,#0a63c4 58%,#0a4f9e)}
.cc-danamon{background:linear-gradient(135deg,#7f0a10,#d92b2b 60%,#a80f18)}
.cc-bni{background:linear-gradient(135deg,#9a3412,#f97316 55%,#c2410c)}
.cc-dbs{background:linear-gradient(135deg,#0b0b0b,#242424 60%,#3a3a3a);box-shadow:0 12px 26px rgba(0,0,0,.5),inset 0 0 0 1px rgba(236,28,36,.55)}
.cc-octo{background:linear-gradient(135deg,#5E0014,#B00022 62%,#7A0019)}
.cc-mandiri{background:linear-gradient(135deg,#06305e,#14539b 60%,#0b3f77)}
.cc-other{background:linear-gradient(135deg,#052659,#5483B3 65%,#0A3E7A)}
.cc.cc-empty{filter:saturate(.72) brightness(.94)}
.cc-hint{font-size:11px;color:var(--mut);text-align:center;margin-top:6px}
.cc-dots{display:flex;gap:6px;justify-content:center;margin-top:12px}
.cc-dots i{width:6px;height:6px;border-radius:50%;background:var(--line);transition:background .2s,transform .2s}
.cc-dots i.on{background:var(--mint);transform:scale(1.3)}
.catrowitem{border-radius:12px;cursor:pointer;transition:background .15s;padding:2px 4px;margin:0 -4px}
.catrowitem:active{background:rgba(193,232,255,.06)}
/* kartu penyemangat setelah mencatat */
.praise{position:fixed;left:14px;right:14px;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:60;
  background:var(--sheet-bg);border:1px solid var(--sheet-line);border-radius:20px;padding:14px 14px 12px;
  box-shadow:0 18px 44px rgba(1,8,20,.45),0 2px 6px rgba(1,8,20,.18);transform:translateY(16px);opacity:0;transition:transform .25s ease,opacity .25s ease}
.praise.on{transform:none;opacity:1}
button.ins{width:100%;text-align:left;font:inherit;color:inherit;border:0;cursor:pointer;
  display:flex;gap:11px;align-items:flex-start}
button.ins:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
button.ins .ic{flex:none}
/* popup dan sheet memakai permukaan padat agar tidak tembus konten di mode gelap */
.sheet{background:var(--sheet-bg);border-top:1px solid var(--sheet-line)}
#toast{background:var(--sheet-bg);border:1px solid var(--sheet-line);color:var(--tx)}

.praise .prow{display:flex;gap:12px;align-items:flex-start}
.praise .pem{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-size:20px;
  background:color-mix(in srgb,var(--mint) 16%,transparent);flex:none}
.praise .pt{font-weight:700;font-size:14px;line-height:1.3;color:var(--tx)}
.praise .ps{font-size:12px;color:var(--mut);margin-top:2px}
.praise .pearl{margin-top:10px;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:9px 11px;
  font-size:11.5px;color:var(--tx);line-height:1.45}
.praise .pearl b{color:var(--mint);font-weight:700}
.praise .pbar{height:3px;border-radius:3px;background:var(--s2);margin-top:10px;overflow:hidden}
.praise .pbar i{display:block;height:100%;background:var(--mint);width:100%;transform-origin:left;animation:pdrain 4.6s linear forwards}
@keyframes pdrain{from{transform:scaleX(1)}to{transform:scaleX(0)}}
/* geser transaksi: kiri hapus, kanan edit */
:root{--row:#FFFFFF}
body.dark{--row:#0C1726}
.txwrap{position:relative;overflow:hidden;border-radius:14px}
.txact{position:absolute;top:0;bottom:0;display:flex;align-items:center;gap:7px;padding:0 16px;
  font-size:12px;font-weight:700;color:#fff;letter-spacing:.01em;opacity:0;transition:opacity .15s ease}
.txwrap.dragging .txact{opacity:1}
.txact.edit{left:0;background:linear-gradient(90deg,#2F6FB2 55%,rgba(47,111,178,.15))}
.txact.del{right:0;background:linear-gradient(270deg,#E0534A 55%,rgba(224,83,74,.15))}
.txwrap .tx{position:relative;z-index:1;background:transparent;transform:translateX(0);
  transition:transform .2s cubic-bezier(.2,.8,.2,1);touch-action:pan-y}
.txwrap .tx.dragging{transition:none;background:var(--row)}
/* kartu portofolio aset */
.pf{position:relative;overflow:hidden;border-radius:24px;margin:0 0 14px;padding:16px 16px 12px;color:#fff;
  background:linear-gradient(150deg,#0B3C7A,#1B62BE 55%,#3E86E0);
  box-shadow:0 16px 34px rgba(9,30,60,.26),inset 0 1px 0 rgba(255,255,255,.25)}
.pf .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;position:relative;z-index:1;min-width:0}
.pf .top > div{min-width:0}
.pf .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px;position:relative;z-index:1}
/* kartu insight */
.ins{display:flex;gap:11px;align-items:flex-start;border-radius:20px;padding:14px 15px;margin-bottom:14px;

.ins .ic{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;flex:none;font-size:17px}

.ins .ibody b{font-weight:700}
.ins .ibody .tagline{display:block;font-size:11px;color:var(--mut);margin-top:4px}
.ins.good .ic{background:color-mix(in srgb,var(--mint) 18%,transparent);color:var(--mint)}
.ins.warn .ic{background:color-mix(in srgb,var(--amber) 20%,transparent);color:var(--amber)}
.ins.bad .ic{background:color-mix(in srgb,var(--coral) 18%,transparent);color:var(--coral)}

.wkbar{display:flex;align-items:flex-end;gap:5px;height:44px;margin-top:12px;width:100%}
.wkbar i{flex:1 1 0;min-width:0;border-radius:4px;background:color-mix(in srgb,var(--mint) 32%,transparent);min-height:4px}
.wkbar i.hi{background:var(--mint)}
.wklbl{display:flex;gap:5px;margin-top:5px;width:100%}

.wkchip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;margin-top:9px}
.wkchip.down{background:color-mix(in srgb,var(--mint) 16%,transparent);color:var(--mint)}
.wkchip.up{background:color-mix(in srgb,var(--coral) 14%,transparent);color:var(--coral)}
/* top kategori bertingkat */
.tops{margin-top:11px;display:flex;flex-direction:column;gap:8px}

.toprow .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toprow .b{flex:0 0 88px;height:7px;border-radius:5px;background:var(--s2);overflow:hidden}
.toprow .b i{display:block;height:100%;border-radius:5px}
.toprow .v{font-variant-numeric:tabular-nums;color:var(--mut);font-size:11px;flex:none}

.s2s{position:relative;overflow:hidden;border-radius:22px;padding:15px 16px 13px;margin-bottom:14px;
  background:linear-gradient(150deg,#0F9D6B,#0C7D55 60%,#0A6344);color:#fff;
  box-shadow:0 14px 30px rgba(6,60,40,.30),inset 0 1px 0 rgba(255,255,255,.22)}
.s2s::after{content:'';position:absolute;inset:-40% -20%;pointer-events:none;
  background:radial-gradient(55% 55% at 85% 0%,rgba(255,255,255,.22),transparent 60%)}
.s2s .k{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.8;position:relative;z-index:1;
  display:flex;align-items:center;gap:6px}
.s2s .amt{font-size:clamp(26px,8vw,34px);font-weight:700;letter-spacing:-.02em;line-height:1.05;margin:3px 0 2px;

.s2s .rows{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;position:relative;z-index:1}

.s2s .foot{font-size:10.5px;opacity:.85;margin-top:7px;position:relative;z-index:1}
.nw{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.nw > div{min-width:0}
.nw .k{font-size:10px;color:var(--mut);font-weight:600}
.nw .v{font-size:12.5px;font-weight:700;margin-top:2px;white-space:nowrap;letter-spacing:-.02em}
.nwbig{font-size:clamp(24px,7.4vw,30px);font-weight:700;letter-spacing:-.02em;margin:2px 0 8px}
.goal{margin-top:12px}

.goal .gt span:last-child{color:var(--mut);font-weight:500;font-size:11px}
.goal .gb{height:8px;border-radius:6px;background:var(--s2);margin-top:6px;overflow:hidden}
.goal .gb i{display:block;height:100%;border-radius:6px;background:var(--mint)}
.goal .gm{font-size:10.5px;color:var(--mut);margin-top:4px}

.bhero{border-radius:18px;padding:14px 15px;background:var(--s2);border:1px solid var(--line);margin-top:2px}
.bhero.over{background:color-mix(in srgb,var(--coral) 10%,var(--s2));border-color:color-mix(in srgb,var(--coral) 34%,var(--line))}
.bhero.warn{background:color-mix(in srgb,var(--amber) 12%,var(--s2));border-color:color-mix(in srgb,var(--amber) 36%,var(--line))}
.bhero .k,.bgrid .k{font-size:10px;color:var(--mut);font-weight:700;letter-spacing:.03em}
.bhero .big{font-size:clamp(20px,6vw,25px);font-weight:700;letter-spacing:-.02em;margin-top:3px;white-space:nowrap}
.brow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.bstat{font-size:10px;font-weight:700;border-radius:999px;padding:4px 9px;white-space:nowrap;

.bhero.over .bstat,.envbox.over .bstat{background:color-mix(in srgb,var(--coral) 16%,transparent);color:var(--coral)}
.bhero.warn .bstat,.envbox.warn .bstat{background:color-mix(in srgb,var(--amber) 20%,transparent);color:var(--amber)}

.cstat.high{background:color-mix(in srgb,var(--coral) 10%,transparent);color:#C23A32}
.bmeta{font-size:11.5px;color:var(--mut);margin-top:7px}

.bgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px 10px;margin-top:12px}
.bgrid .v{font-size:13px;font-weight:700;margin-top:2px;white-space:nowrap;letter-spacing:-.02em}
.bnote{font-size:11px;color:var(--mut);line-height:1.5;margin-top:6px}
.seg50{display:flex;height:10px;border-radius:6px;overflow:hidden}
.seg50 i{display:block;height:100%}
.envbox{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.envbox .envname{font-size:13px;font-weight:700}

.cmid{flex:1;min-width:0;display:flex;flex-direction:column}
.cname{font-size:12.5px;font-weight:600}
.csub{font-size:10.5px;color:#55677A}
.cstat{font-size:10px;font-weight:700;white-space:nowrap;border-radius:999px;padding:3px 8px;
  background:color-mix(in srgb,var(--mint) 16%,transparent);color:#0B7A52}
.cstat.warn{background:color-mix(in srgb,var(--amber) 20%,transparent);color:#8A5A00}
.cstat.over{background:color-mix(in srgb,var(--coral) 14%,transparent);color:#C23A32}
.cstat.none{background:var(--s2);color:var(--mut)}
/* ==== sistem ikon final: Soft Monochrome x Apple Minimalist x Semantic ==== */
:root{
  --ic-ink:#64748B; --ic-bg:#FFFFFF; --ic-line:#E5E7EB;
  --exp:#C6534A; --exp-bg:#FCEDEC;
  --inc:#39866A; --inc-bg:#EAF5EF;
  --trf:#3478C6; --trf-bg:#EDF4FC;
  --wn:#B78335; --wn-bg:#FBF3E6;
  --neu:#64748B; --neu-bg:#F1F3F5;
}
body.dark{
  --ic-ink:#94A3B8; --ic-bg:#121C29; --ic-line:#22303F;
  --exp:#E0776E; --exp-bg:rgba(224,119,110,.14);
  --inc:#5FB394; --inc-bg:rgba(95,179,148,.14);
  --trf:#6FA6E8; --trf-bg:rgba(111,166,232,.14);

  function proxyPrices(codes, done) {
    var out = {}, left = codes.length;

    codes.forEach(function (code) {
      var yahoo = 'https://query1.finance.yahoo.com/v8/finance/chart/' + encodeURIComponent(code + '.JK') + '?range=5d&interval=1d';
      var url = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(yahoo);
      var finished = false;
      function finish() { if (finished) return; finished = true; left--; if (left <= 0) done(out); }
      try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', url, true);
        xhr.timeout = 8000;
        xhr.onload = function () {
          try {
            if (xhr.status === 200) {

              var r0 = d && d.chart && d.chart.result && d.chart.result[0];
              var meta = (r0 && r0.meta) || {};

              }
            }
          } catch (e) {}
          finish();
        };
        xhr.onerror = finish;
        xhr.ontimeout = finish;

  function allocCard(d) {
    var pt = portfolioTotals(d);
    if (!pt.list.length || !(pt.value > 0)) return '';
    var byKind = {};
    pt.list.forEach(function (a) {
      var px = assetPrice(a);
      if (!(px > 0)) return;
      var k = a.kind || 'lainnya';
      byKind[k] = (byKind[k] || 0) + a.units * px;
    });
    var kinds = Object.keys(byKind);
    if (!kinds.length) return '';
    var order = ['saham', 'reksadana', 'crypto', 'emas', 'lainnya'];
    kinds.sort(function (a, b) { return order.indexOf(a) - order.indexOf(b); });
    var colors = { saham: '#2F6FB2', reksadana: '#F2B84B', crypto: '#7C5CBF', emas: '#C9A227', lainnya: '#8FB3D9' };
    var bar = '', leg = '';
    kinds.forEach(function (k) {
      var pct = byKind[k] / pt.value * 100;
      bar += '<i style="width:' + pct.toFixed(1) + '%;background:' + (colors[k] || '#8FB3D9') + '"></i>';
      leg += '<span><span class="dot" style="background:' + (colors[k] || '#8FB3D9') + '"></span>' +
        (k.charAt(0).toUpperCase() + k.slice(1)) + ' <b>' + Math.round(pct) + '%</b></span>';
    });
    return '<div class="card"><h2>Alokasi</h2><div class="alloc">' + bar + '</div><div class="legend3">' + leg + '</div></button>';
  }

  function assetsCard(d) {
    var rp = function (n) { return mrp(n, 'portfolio'); };
    var pt = portfolioTotals(d);
    var list = pt.list;
    var h = '<div class="card"><h2>Aset (' + list.length + ')</h2>';
    if (!list.length) {
      h += '<div class="es" style="padding:10px 0 4px"><div class="emo">📈</div><div class="ttl">Belum ada aset</div>' +
        '<div class="hint">Tambahkan saham atau reksadana. Harga saham diambil otomatis, reksadana pakai NAV yang kamu isi.</div></div>';
    } else {
      list.forEach(function (a, idx) {
        var px = assetPrice(a);
        var qty = Number(a.units) || 0;
        var val = qty * (px > 0 ? px : a.buyPrice);
        var cost = qty * a.buyPrice;
        var pl = px > 0 ? val - cost : 0;
        var pct = (px > 0 && cost > 0) ? (pl / cost * 100) : 0;
        var color = assetTint(idx);
        var priceTxt = px > 0 ? rp(px) : rp(a.buyPrice);
        var line2 = px > 0
          ? '<span class="apl ' + (pl >= 0 ? 'up' : 'down') + '">' + (pl >= 0 ? '+' : '−') + rp(Math.abs(pl)) +
              ' · ' + (pct >= 0 ? '+' : '') + pct.toFixed(1).replace('.', ',') + '%</span>'
          : '<span class="apl muted">harga belum diisi</span>';
        h += '<button class="arow" type="button" data-act="asset-edit" data-code="' + esc(a.code) + '" aria-label="Ubah aset ' + esc(a.code) + '">' +
          '<span class="abadge">' + assetInitials(a) + '</span>' +
          '<span class="amid"><span class="acode">' + esc(a.code) + '</span>' +
            '<span class="asub">' + assetQtyText(a) + ' × ' + priceTxt + '</span></span>' +
          '<span class="aright"><span class="aval">' + rp(val) + '</span>' + line2 + '</span>' +
          '</button>';
      });
      h += '<div class="partact" style="margin-top:12px"><button class="mini" data-act="asset-add">Tambah aset</button></div>' +
        '<div class="empty" style="padding:8px 0 0;font-size:10.5px;text-align:center">Ketuk aset untuk mengubah atau menghapus</div>';
    }
    h += '</div>';
    return h;
  }

  function viewDompet(d) {
    var rp = function (n) { return mrp(n, 'wallet'); };
    var h = '', methods = d.methods || [];
    var kk = d.kkTotal || 0, saldo = 0;
    methods.forEach(function (m) { if (m.kind !== 'utang') saldo += m.value; });

    var seg = (state.walletSeg === 'aset' || state.walletSeg === 'rencana') ? state.walletSeg : 'dompet';
    h += '<div class="seg">' +
      '<button data-act="seg" data-seg="dompet" class="' + (seg === 'dompet' ? 'on' : '') + '">Dompet</button>' +

      '<button data-act="seg" data-seg="rencana" class="' + (seg === 'rencana' ? 'on' : '') + '">Rencana</button></div>';

    if (seg === 'rencana') {
      h += goalsCard(d);
      h += subsCard(d);
      return h;
    }
    if (seg === 'aset') {
      h += netWorthCard(d);
      h += portfolioCard(d);
      h += allocCard(d);
      h += assetsCard(d);
      return h;
    }

    h += '<div class="card"><h2>Wallet</h2><div class="wkrow">' +
      '<div><div class="k">Available balance</div><div class="v mono ' + (saldo < 0 ? 'neg' : 'pos') + '">' + rp(saldo) + '</div></div>' +

      '</div></div>';

    h += emoneyDeck(d);
    h += walletsCard(d);
    h += instalmentsCard(d);
    if (!methods.length) {
      h += '<div class="card"><h2>Payment methods</h2><div class="empty">No transactions with a payment method yet.</div></div>';
    } else {
      var saldoItems = methods.filter(function (m) { return m.kind !== 'utang'; });
      var kkItems = methods.filter(function (m) { return m.kind === 'utang'; });
      if (saldoItems.length) {
        var maxOut = 1;
        saldoItems.forEach(function (m) { maxOut = Math.max(maxOut, m.monthOut || 0); });
        h += '<div class="card"><h2>Balance</h2><div class="methods">';
        saldoItems.forEach(function (m) {
          var pct = Math.round((m.monthOut || 0) / maxOut * 100);
          h += '<div class="mth"><div class="mthico">' + methodIcon(m.name) + '</div>' +
            '<div class="mthmain"><div class="mthname">' + esc(m.name) + '</div>' +

            '<div class="mthsub">Spent this month ' + rp(m.monthOut || 0) + '</div></div>' +
            '<div class="mthval mono ' + (m.value < 0 ? 'neg' : (m.value > 0 ? 'pos' : '')) + '">' + rp(m.value) + '</div></div>';
        });
        h += '</div></div>';
      }
      if (kkItems.length) h += creditDeck(kkItems);
    }

    var L = d.loans || { persons: [] };
    h += '<details class="card drop"' + (L.persons.length ? ' open' : '') + '><summary><span>Debts &amp; receivables</span><span class="chev">›</span></summary>';
    if (!L.persons.length) h += '<div class="empty" style="margin-top:10px">No debts or receivables yet.</div>';
    else {
      h += '<div class="lsum"><span>Owed to you <b class="pos mono">' + rp(L.piutang || 0) + '</b></span><span>You owe <b class="neg mono">' + rp(L.hutang || 0) + '</b></span></div>';
      L.persons.forEach(function (p) {
        var n = p.net, txt = n > 0 ? 'Owes you' : (n < 0 ? 'You owe them' : 'Settled');
        h += '<div class="kv"><span>' + esc(p.name) + '<small>' + txt + '</small></span><span class="mono ' + (n > 0 ? 'pos' : (n < 0 ? 'neg' : '')) + '">' + rp(Math.abs(n)) + '</span></div>';
      });
    }
    h += '<div class="empty" style="font-size:12px;margin-top:10px">Balances are calculated from all entries. To pay a card bill, add an Income entry with the same card method.</div></details>';
    return h;
  }

  function b64ToBytes(s) {
    var b = atob((s + '==='.slice((s.length + 3) % 4)).replace(/-/g, '+').replace(/_/g, '/')), a = new Uint8Array(b.length);
    for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i);
    return a;
  }
  function pushApi(action, body) {
    if (!PUSH_ENDPOINT) return Promise.reject(new Error('Notifications are not available on this host.'));
    return fetch(PUSH_ENDPOINT + '/' + action, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {})
      .then(function (r) {
        var ct = (r.headers && r.headers.get && r.headers.get('content-type')) || '';
        if (ct.indexOf('json') < 0) throw new Error('The notification server did not answer. This feature needs a server behind the app.');
        return r.json();
      });
  }

  function refreshPush() {
    state.push.supported = !!PUSH_ENDPOINT && 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
    if (!state.push.supported) return;
    state.push.denied = Notification.permission === 'denied';
    pushReg().then(function (reg) { return reg.pushManager.getSubscription(); }).then(function (sub) {
      state.push.on = !!sub && Notification.permission === 'granted';
      if (state.tab === 'setelan') renderAll();
    }).catch(function () {});
  }
  function pushDone(msg) { state.push.busy = false; if (msg) toast(msg); refreshPush(); renderAll(); }
  function pushOff(quiet) {
    if (!state.push.supported) return Promise.resolve();
    return pushReg().then(function (reg) { return reg.pushManager.getSubscription(); }).then(function (sub) {
      if (!sub) return;
      return pushApi('unsubscribe', { endpoint: sub.endpoint }).catch(function () {}).then(function () { return sub.unsubscribe(); });
    }).then(function () { if (!quiet) pushDone('Notifications turned off'); }, function () { if (!quiet) pushDone('Could not turn notifications off'); });
  }
  function pushOn() {
    Notification.requestPermission().then(function (perm) {
      if (perm !== 'granted') { state.push.denied = perm === 'denied'; throw new Error('Notification permission was not granted'); }
      return Promise.all([pushReg(), pushApi('key')]);
    }).then(function (r) {
      var reg = r[0];
      if (!r[1] || !r[1].publicKey) throw new Error('The notification server did not answer');
      return reg.pushManager.getSubscription().then(function (old) {
        return old || reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(r[1].publicKey) });
      });
    }).then(function (sub) {
      return pushApi('subscribe', { subscription: sub.toJSON(), url: state.url, token: state.token }).then(function (res) {
        if (!res || !res.ok) { sub.unsubscribe(); throw new Error((res && res.error) || 'Could not turn notifications on'); }
      });
    }).then(function () { pushDone('🔔 Notifications on'); }, function (e) { pushDone(e && e.message && !/^NET/.test(e.message) ? e.message : 'Could not turn notifications on'); });
  }

  function fallbackHash(s) { var h = 0; for (var i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0; return 'h' + h; }

  }

      if (list[i].name === cat) return Math.round((list[i].spent + (extra || 0)) / list[i].limit * 100);
    }
    return null;
  }

  // ================= keranjang anggaran (Needs / Wants) =================
  var BUCKET_NEEDS = ['tagihan & utilitas', 'listrik', 'air pdam', 'internet & tv', 'pulsa & data', 'transportasi', 'kos / sewa tempat', 'bbm', 'makan', 'belanja kebutuhan harian', 'kesehatan', 'pendidikan', 'perawatan kendaraan', 'asuransi'];
  var BUCKET_WANTS = ['sumbangan / kondangan', 'jajan', 'belanja', 'belanja pakaian / fashion', 'hiburan', 'hadiah', 'lainnya'];
  function periodMode() { var s = serverSettings(); return (s && s.periodMode) || LS.get('ck_period', 'calendar'); }
  function planTargets() {
    var s = serverSettings();
    if (s && s.needs > 0 && s.wants > 0 && (s.needs + s.wants + (s.savings || 0)) === 100) {
      return { needs: s.needs, wants: s.wants, savings: s.savings || 0 };
    }
    try {
      var x = JSON.parse(LS.get('ck_targets', '') || '{}');
      if (x && x.needs > 0 && x.wants > 0) return { needs: x.needs, wants: x.wants, savings: Math.max(0, x.savings || 0) };
    } catch (e) {}
    return { needs: 50, wants: 30, savings: 20 };
  }
  function bucketOf(name) {
    var s = serverSettings();
    if (s && s.buckets && s.buckets[name]) return s.buckets[name];
    var n = String(name || '').toLowerCase();
    if (BUCKET_NEEDS.indexOf(n) >= 0) return 'needs';
    if (BUCKET_WANTS.indexOf(n) >= 0) return 'wants';
    for (var i = 0; i < BUCKET_NEEDS.length; i++) if (n.indexOf(BUCKET_NEEDS[i].split(' ')[0]) === 0) return 'needs';
    return 'wants';
  }
  function saveSetting(key, value) { return api('settings_set', { key: key, value: String(value) }); }
  function afterSettings() {
    var pr = loadMonth(state.month, { silent: true });
    if (pr && pr.then) pr.then(renderAll); else renderAll();
  }

  function envelopeData(d) {
    var plan = planTargets();
    var income = (d.kpi && d.kpi.masuk) || 0;
    var cats = {}, limits = {};
    (d.categories || []).forEach(function (c) { cats[c.name] = c.amount; });
    (d.budgets || []).forEach(function (b) { limits[b.name] = b.limit; });
    var names = {};
    Object.keys(cats).forEach(function (n) { names[n] = true; });
    Object.keys(limits).forEach(function (n) { names[n] = true; });
    var out = { needs: { key: 'needs', label: 'Needs', pct: plan.needs, note: 'Tagihan, transportasi, belanja harian, kesehatan', cats: [] },
                wants: { key: 'wants', label: 'Wants', pct: plan.wants, note: 'Makan di luar, hiburan, belanja', cats: [] },
                skip:  { key: 'skip', label: 'Tidak dihitung', pct: 0, note: 'Di luar batas pengeluaran', cats: [] } };
    Object.keys(names).forEach(function (n) {
      var b = bucketOf(n);
      (out[b] || out.skip).cats.push({ name: n, spent: cats[n] || 0, limit: limits[n] || 0 });
    });
    ['needs', 'wants'].forEach(function (k) {
      var g = out[k];
      g.ceiling = Math.round(income * g.pct / 100);
      g.spent = g.cats.reduce(function (s, c) { return s + c.spent; }, 0);
      g.catLimits = g.cats.reduce(function (s, c) { return s + c.limit; }, 0);
      g.cats.sort(function (a, b) { return b.spent - a.spent; });
    });
    return { groups: out, plan: plan, income: income };
  }

  function smartAllocation() {
    var d = state.data || {};
    var env = envelopeData(d);
    var plan = [];
    ['needs', 'wants'].forEach(function (k) {
      var g = env.groups[k];
      if (!g.ceiling || !g.cats.length) return;
      var totalSpent = g.cats.reduce(function (s, c) { return s + (c.spent || 0); }, 0);
      var weights = g.cats.map(function (c) {
        return totalSpent > 0 ? (c.spent || 0) : 1;
      });
      var wsum = weights.reduce(function (s, w) { return s + w; }, 0) || 1;
      g.cats.forEach(function (c, i) {
        var raw = g.ceiling * (weights[i] / wsum);
        var lim = Math.max(50000, Math.round(raw / 10000) * 10000);
        plan.push({ cat: c.name, limit: lim, group: g.label });
      });
    });
    if (!plan.length) { toast('Belum ada kategori untuk dibagi'); return; }
    var total = plan.reduce(function (s, x) { return s + x.limit; }, 0);
    var preview = plan.slice(0, 4).map(function (x) { return x.cat + ' ' + rp(x.limit); }).join(', ');
    if (!confirm('Bagi limit otomatis?\n\n' + plan.length + ' kategori, total ' + rp(total) +
      '\n\n' + preview + (plan.length > 4 ? ', dan ' + (plan.length - 4) + ' lainnya' : '') +
      '\n\nLimit yang sudah ada akan ditimpa.')) return;
    var i = 0;
    function next() {
      if (i >= plan.length) {
        toast('✅ ' + plan.length + ' limit dibagi');
        var pr = loadMonth(state.month, { silent: true });
        if (pr && pr.then) pr.then(function () { closeSheets(); setTab('insights'); });
        return;
      }
      var it = plan[i++];
      api('budget_set', { kategori: it.cat, limit: it.limit })
        .then(next)
        .catch(function () { toast('Gagal di ' + it.cat); });
    }
    next();
  }

    html += '<div class="bgrid">' +

    html += '<div class="bnote">Belum dialokasikan artinya limit yang belum dibagi ke kategori. Itu bukan uang yang belum dibelanjakan.</div>';

    var pn = plan.needs || 0, pw = plan.wants || 0, ps = Math.max(0, 100 - pn - pw);
    html += '<div class="seg50" style="margin-top:12px">' +
      '<i style="width:' + pn + '%;background:var(--mint)"></i>' +

      '<i style="width:' + ps + '%;background:#5483B3"></i></div>' +
      '<div class="legend3" style="margin-top:7px">' +
        '<span><span class="dot" style="background:var(--mint)"></span>Needs <b>' + pn + '%</b></span>' +
        '<span><span class="dot" style="background:var(--amber)"></span>Wants <b>' + pw + '%</b></span>' +
        '<span><span class="dot" style="background:#5483B3"></span>Tabungan <b>' + ps + '%</b></span></div>';
    html += '<details style="margin-top:10px"><summary style="cursor:pointer;font-size:11.5px;color:var(--mut)">Cara menghitung batas</summary>' +

      '. Ubah persentase lewat tombol Atur rencana di bawah.</div></details>';

    ['needs', 'wants'].forEach(function (k) {
      var g = env.groups[k];
      var gp = g.ceiling ? Math.round(g.spent / g.ceiling * 100) : 0;
      var gst = gp >= 100 ? 'over' : (gp >= 80 ? 'warn' : 'ok');
      var gRemain = g.ceiling - g.spent;
      var gFree = Math.max(0, g.ceiling - g.catLimits);
      var gStat = gst === 'over' ? 'Lewat budget' : (gst === 'warn' ? 'Waspada' : 'Normal');
      html += '<div class="envbox ' + gst + '">' +

      if (g.cats.length) {
        g.cats.forEach(function (c) {
          var cp = c.limit ? Math.round(c.spent / c.limit * 100) : 0;

            '<span class="cstat ' + cst + '">' + cLabel + '</span></button>';
          if (c.limit) {

      '<button class="btn" data-act="ai">Get AI advice</button><div id="aiOut" class="revitem" hidden style="margin-top:10px"></div></div>';
    return html;
  }

  // ================= interaksi di layar =================
  // geser baris transaksi: kanan = edit, kiri = hapus
  var swipe = { row: null, x0: 0, y0: 0, dx: 0, on: false, axis: null, pid: null };

  function swipeReset() {
    if (swipe.row) {
      swipe.row.classList.remove('dragging');
      swipe.row.style.transform = '';
      if (swipe.row.parentNode) swipe.row.parentNode.classList.remove('dragging');
    }
    swipe.row = null; swipe.dx = 0; swipe.on = false; swipe.axis = null; swipe.pid = null;
  }

  function swipeEnd() {
    if (!swipe.on) { swipeReset(); return; }
    var row = swipe.row, dx = swipe.dx, id = row && row.getAttribute('data-id');
    var horizontal = swipe.axis === 'x' && Math.abs(dx) > 55;
    var moved = swipe.axis === 'x' && Math.abs(dx) > 8;
    swipeReset();
    if (moved) state.swipeBlock = true;   // geser sedikit pun jangan sampai malah membuka detail
    if (!row || !horizontal) return;
    if (dx > 0) openEdit(id);
    else if (confirm('Hapus transaksi ini?')) {
      var recSwipe = null;
      ((state.data && state.data.recent) || []).forEach(function (x) { if (x.id === id) recSwipe = x; });
      api('delete', { id: id }).then(function (r) {
        if (r && r.ok) { toast('🗑️ Dihapus', 'Urungkan', function () { undoDelete(recSwipe); }); loadMonth(state.month, { silent: true }); }
        else toast((r && r.error) || 'Could not delete');
      }).catch(function () { toast('Cannot reach the server'); });
    }
  }

  $('view').addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    var row = e.target.closest('.tx');
    if (!row) return;
    swipe.row = row; swipe.x0 = e.clientX; swipe.y0 = e.clientY;
    swipe.dx = 0; swipe.on = true; swipe.axis = null; swipe.pid = e.pointerId;
    row.classList.add('dragging');
    if (row.parentNode) row.parentNode.classList.add('dragging');
    try { row.setPointerCapture(e.pointerId); } catch (err) {}
  });

  $('view').addEventListener('pointermove', function (e) {
    if (!swipe.on) return;
    if (swipe.pid !== null && e.pointerId !== swipe.pid) return;
    var dx = e.clientX - swipe.x0, dy = e.clientY - swipe.y0;

    if (!swipe.axis) {
      if (Math.abs(dx) < 7 && Math.abs(dy) < 7) return;
      swipe.axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
      if (swipe.axis === 'y') {          // niatnya menggulir: batalkan geser
        swipeReset();
        return;
      }
    }
    if (swipe.axis !== 'x') return;
    if (e.cancelable) e.preventDefault();
    swipe.dx = dx;
    swipe.row.style.transform = 'translateX(' + Math.max(-120, Math.min(120, dx)) + 'px)';
  }, { passive: false });

  $('view').addEventListener('pointerup', swipeEnd);
  $('view').addEventListener('pointercancel', swipeEnd);

      api('cicilan_add', { nama: nm, per: $('ciPer').value, tenor: $('ciTenor').value, paid: $('ciPaid').value, due: $('ciDue').value })
        .then(function (r) {
          if (r && r.ok) { closeSheets(); toast('✅ Instalment saved'); var pr3 = loadMonth(state.month, { silent: true }); if (pr3 && pr3.then) pr3.then(renderAll); }
          else { el.disabled = false; el.textContent = 'Save instalment'; $('ciErr').textContent = (r && r.error) || 'Could not save'; }
        }).catch(function () { el.disabled = false; el.textContent = 'Save instalment'; $('ciErr').textContent = 'Cannot reach the server'; });
    }
    else if (act === 'install-ok') { LS.set('ck_install_seen', '1'); closeSheets(); toast('You can install later from Settings'); }
    else if (act === 'plan-save') {
      var n1 = parseInt(String($('pNeeds').value).replace(/\D/g, ''), 10) || 0;
      var n2 = parseInt(String($('pWants').value).replace(/\D/g, ''), 10) || 0;
      var n3 = parseInt(String($('pSav').value).replace(/\D/g, ''), 10) || 0;
      if (n1 + n2 + n3 !== 100) { $('pErr').textContent = 'Needs + Wants + Savings must add up to 100% (now ' + (n1 + n2 + n3) + '%)'; return; }
      LS.set('ck_targets', JSON.stringify({ needs: n1, wants: n2, savings: n3 }));
      Promise.all([
        saveSetting('target_needs', n1),
        saveSetting('target_wants', n2),
        saveSetting('target_savings', n3)
      ]).then(function (res) {
        var bad = res.filter(function (r) { return !r || !r.ok; })[0];
        closeSheets();
        toast(bad ? ((bad && bad.error) || 'Saved on this phone only') : 'Plan updated');
        afterSettings();
      }).catch(function () { closeSheets(); toast('Saved on this phone only'); renderAll(); });
    }
    else if (act === 'budget-save') {
      var bcat = $('bcat').value, blim = String($('blim').value).replace(/\D/g, '');
      if (!blim) { $('bErr').textContent = 'Enter a monthly limit'; return; }
      el.disabled = true; el.textContent = 'Saving…';
      api('budget_set', { kategori: bcat, limit: Number(blim) }).then(function (r) {
        if (r && r.ok) { toast('✅ Budget saved'); afterBudgetChange(); }
        else { el.disabled = false; el.textContent = 'Save budget'; $('bErr').textContent = (r && r.error) || 'Could not save'; }
      }).catch(function () { el.disabled = false; el.textContent = 'Save budget'; $('bErr').textContent = 'Cannot reach the server'; });
    }
    else if (act === 'ai') {
      var out = $('aiOut'); if (!out) return;
      out.hidden = false;
      out.innerHTML = '<div class="revtext" style="font-weight:400">Reading your month…</div>';
      var aiUrl = PUSH_ENDPOINT ? PUSH_ENDPOINT.replace(/\/api\/push\/?$/, '/api/ai/insight') : '';
      if (!aiUrl) { out.textContent = 'AI advisor is not configured.'; return; }
      fetch(aiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ digest: buildDigest() }) })
        .then(function (r) { return r.json(); })
        .then(function (r) {
          if (r && r.ok) out.innerHTML = '<div class="revtext" style="font-weight:400">' + esc(r.text).replace(/\n/g, '<br>') + '</div>';
          else if (r && /not configured/i.test(r.error || '')) out.textContent = 'AI advisor is not set up yet, add an AI_API_KEY secret in the Worker.';
          else out.textContent = (r && r.error) || 'AI could not answer right now.';
        })
        .catch(function () { out.textContent = 'Could not reach the AI service.'; });
    }
    else if (act === 'sheet-back') { sheetBack(); }
    else if (act === 'pin-save') {
      var p1 = $('pin1').value.trim(), p2 = $('pin2').value.trim();
      if (!/^\d{4,6}$/.test(p1)) { $('pinErr2').textContent = 'PIN must be 4–6 digits'; return; }
      if (p1 !== p2) { $('pinErr2').textContent = 'PINs do not match'; return; }
      pinHash(p1, function (hv) { LS.set('ck_pin', hv); closeSheets(); toast('🔒 PIN enabled'); renderAll(); });
    }
    else if (act === 'del0') openDetail(id, false);
    else if (act === 'del2') {
      el.disabled = true; el.textContent = 'Menghapus…';
      var recDel = null;
      ((state.data && state.data.recent) || []).forEach(function (x) { if (x.id === id) recDel = x; });
      api('delete', { id: id }).then(function (r) {
        if (r && r.ok) { closeSheets(); toast('🗑️ Dihapus', 'Urungkan', function () { undoDelete(recDel); }); loadMonth(state.month, { silent: true }); }
        else { $('delErr').textContent = (r && r.error) || 'Could not delete'; el.disabled = false; el.textContent = 'Yes, delete this entry'; }
      }).catch(function (e2) { $('delErr').textContent = e2.code === 'NET' ? 'You need internet to delete.' : 'Delete failed.'; el.disabled = false; el.textContent = 'Yes, delete this entry'; });
    }
  });

  function setTab(t) { state.tab = t; if (t !== 'setelan' && !state.data) loadMonth(state.month); else renderAll(); window.scrollTo(0, 0); }
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (b) { b.addEventListener('click', function () { setTab(b.getAttribute('data-tab')); }); });
  function clearSearch() { state.q = ''; state.search = null; }
  $('prev').addEventListener('click', function () { if (state.data && state.data.prev) { clearSearch(); loadMonth(state.data.prev); } });
  $('next').addEventListener('click', function () { if (state.data && state.data.next) { clearSearch(); loadMonth(state.data.next); } });

  function connect() {
    var url = $('sUrl').value.trim().replace(/\/macros\/u\/\d+\/s\//, '/macros/s/'), tok = $('sTok').value.trim();
    if (!/^https:\/\/script\.google\.com\/(a\/macros\/[^/]+\/)?macros\/s\/[^/]+\/exec$/.test(url)) { $('sErr').textContent = 'The address must look like https://script.google.com/macros/s/…/exec'; return; }
    if (!tok) { $('sErr').textContent = 'Enter the secret code'; return; }
    var go = $('sGo'); go.disabled = true; go.textContent = 'Menghubungkan…'; $('sErr').textContent = '';
    state.url = url; state.token = tok;
    api('data', { month: '' }).then(function (d) {
      go.disabled = false; go.textContent = 'Hubungkan';
      if (d && d.ok) {
        LS.set('ck_url', url); LS.set('ck_token', tok); state.setupMsg = ''; state.data = d; state.month = d.month; state.fromCache = false;
        LS.set(cacheKey(d.month), JSON.stringify(d)); pruneCache(6); LS.set('ck_lastmonth', d.month); state.lastSync = new Date().toISOString(); LS.set('ck_sync', state.lastSync);
        state.tab = 'ringkasan'; renderAll(); toast('✅ Connected');
      } else { state.token = ''; $('sErr').textContent = d && d.error === 'auth' ? 'Wrong secret code.' : ((d && d.error) || 'Could not connect'); }
    }).catch(function (e) {
      go.disabled = false; go.textContent = 'Hubungkan'; state.token = '';
      $('sErr').textContent = e.code === 'NET' ? 'Could not connect. Check your connection and the URL, and make sure deployment access is "Anyone".' : 'That address did not answer like a proper Web App. Please check the URL again.';
    });
  }

  // tarik untuk muat ulang
  var ptrY = null, ptrDy = 0;
  document.addEventListener('touchstart', function (e) { ptrY = (window.scrollY <= 0 && e.touches.length === 1 && !sheetOpen() && connected()) ? e.touches[0].clientY : null; ptrDy = 0; }, { passive: true });
  document.addEventListener('touchmove', function (e) {
    if (ptrY == null) return; ptrDy = e.touches[0].clientY - ptrY;
    if (ptrDy > 8) { var p = $('ptr'); p.style.transform = 'translateY(' + Math.min(ptrDy * 0.4, 46) + 'px)'; p.style.opacity = Math.min(ptrDy / 90, 1); p.textContent = ptrDy > 90 ? '↑ Release to refresh' : '↓ Pull to refresh'; p.classList.toggle('pull90', ptrDy > 90); }
  }, { passive: true });
  document.addEventListener('touchend', function () {
    var p = $('ptr'); p.style.opacity = 0; p.style.transform = ''; p.classList.remove('pull90');
    if (ptrY != null && ptrDy > 90) { toast('Reloading…'); loadMonth(state.month, { silent: true, manual: true }); }
    ptrY = null; ptrDy = 0;
  });

  // Bulan hanya berpindah lewat tombol ‹ › (gestur geser dihapus: bertabrakan dengan kartu & mudah tersenggol).
  var monthLbl = document.querySelector('.monthbar .lbl');
  if (monthLbl) monthLbl.addEventListener('click', function () {
    if (!state.data) return;
    if (state.month !== state.data.today.slice(0, 7)) { clearSearch(); loadMonth(''); toast('Back to this month'); }
  });

  window.addEventListener('online', function () { flushPending(); if (connected()) loadMonth(state.month, { silent: true }); });
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && connected() && !state.busy && !sheetOpen() && state.tab !== 'setelan' && (!state.lastSync || Date.now() - new Date(state.lastSync).getTime() > 30000)) loadMonth(state.month, { silent: true });
  });
  if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  refreshPush();

  // ---------- indikator offline ----------
  function updateOffline() {
    var el = $('offbar'); if (!el) return;
    if (navigator.onLine) { el.hidden = true; return; }
    var n = (state.pending || []).length;
    el.textContent = n ? 'Offline · ' + n + ' waiting to send' : 'Offline · showing saved data';
    el.hidden = false;
  }
  window.addEventListener('offline', function () { updateOffline(); toast('Offline, new entries stay on this phone'); });
  window.addEventListener('online', function () { updateOffline(); toast('Back online'); });
  updateOffline();

  // ---------- layar pasang (sekali saja) ----------
  function installSteps() {
    if (isIOS()) return [
      'Open this page in <b>Safari</b> (not Chrome, not an in-app browser)',
      'Tap the <b>Share</b> button, square with an arrow pointing up',
      'Scroll down and choose <b>Add to Home Screen</b>, then <b>Add</b>'
    ];
    if (/Android/i.test(navigator.userAgent)) return [
      'Open the browser menu (<b>⋮</b>) at the top right',
      'Choose <b>Install app</b> or <b>Add to Home screen</b>',
      'Confirm, Bamboo gets its own icon'
    ];
    return [
      'Open the address bar menu in your browser',
      'Choose <b>Install Bamboo</b>',
      'Confirm, it opens in its own window'
    ];
  }
  function maybeInstallSheet() {
    if (standalone() || LS.get('ck_install_seen', '') === '1') return;
    if (sheetOpen() || LS.get('ck_pin', '')) return;
    setTimeout(function () {
      if (standalone() || sheetOpen() || !state.data) return;
      var steps = installSteps().map(function (s, i) {
        return '<div class="installstep"><span class="n">' + (i + 1) + '</span><span class="x">' + s + '</span></div>';
      }).join('');
      openBg();
      $('sheetDetail').hidden = false;
      $('sheetDetail').innerHTML = '<div class="grab"></div><h3><span>Install Bamboo</span><button class="iconbtn" data-act="install-ok" aria-label="Close">✕</button></h3>' +
        '<div class="empty" style="padding:0 0 14px">Add it to your Home Screen, it then opens full screen, works offline, and can send notifications.</div>' +
        steps +
        '<button class="btn" data-act="install-ok" style="margin-top:16px">Got it</button>' +
        '<div class="empty" style="padding:10px 0 0;font-size:11px">You will only see this once.</div>';
    }, 1500);
  }

  // ---------- shortcut dari ikon aplikasi ----------
  try {
    var qs = new URLSearchParams(location.search);
    if (qs.get('action') === 'add') setTimeout(function () { if (state.data) openAdd(); }, 600);
    if (qs.get('tab') === 'insights') setTab('insights');
  } catch (e) {}

  // layar pembuka: tampil sebentar lalu memudar
  var splashAt = Date.now();
  function hideSplash() {
    var sp = $('splash'); if (!sp || sp.classList.contains('out')) return;
    setTimeout(function () { sp.classList.add('out'); setTimeout(function () { sp.remove(); }, 500); }, Math.max(0, 1200 - (Date.now() - splashAt)));
  }
  if (document.readyState === 'complete') hideSplash(); else window.addEventListener('load', hideSplash);
  setTimeout(hideSplash, 2500);

  // mulai
  if (LS.get('ck_pin', '')) lockNow();
  applyTheme(THEME);
  if (connected()) loadMonth(''); else renderAll();
  setTimeout(maybeInstallSheet, 2200);
})();
</script>
</body>
</html>
